    /* ---------------- slash menu ---------------- */
    var slashSel = 0, slashItems = [];

    function updateSlash() {
        var v = input.value;
        var m = v.match(/^\/([a-z]*)$/i);
        if (!m) { body.classList.remove('slashing'); return; }
        var q = m[1].toLowerCase();
        slashItems = allCommands().filter(function (c) { return c.n.indexOf(q) === 0; });
        if (!slashItems.length) { body.classList.remove('slashing'); return; }
        slashSel = 0;
        slashmenu.textContent = '';
        slashItems.forEach(function (c, idx) {
            var it = el('div', 'sitem' + (idx === 0 ? ' sel' : ''));
            it.appendChild(el('span', 'n', '/' + c.n + (c.a ? ' ' + c.a : '')));
            it.appendChild(el('span', 'd', c.d));
            it.addEventListener('mousedown', function (ev) {
                ev.preventDefault();
                acceptSlash(idx, true);
            });
            slashmenu.appendChild(it);
        });
        body.classList.add('slashing');
    }
    function moveSlash(delta) {
        var items = slashmenu.querySelectorAll('.sitem');
        if (!items.length) return;
        items[slashSel].classList.remove('sel');
        slashSel = (slashSel + delta + items.length) % items.length;
        items[slashSel].classList.add('sel');
        items[slashSel].scrollIntoView({ block: 'nearest' });
    }
    function acceptSlash(idx, submitIfReady) {
        var c = slashItems[idx === undefined ? slashSel : idx];
        if (!c) return;
        body.classList.remove('slashing');
        if (!c.a && submitIfReady) {
            if (c.agent) runAgentCommand(c, ''); else runSlash(c.n, '');
            input.value = ''; autosize(); return;
        }
        input.value = '/' + c.n + ' ';
        input.focus();
        autosize();
    }

    /* ---------------- composer ---------------- */
    function autosize() {
        input.style.height = 'auto';
        input.style.height = Math.max(48, Math.min(input.scrollHeight, 240)) + 'px';
    }

    function runSlash(cmd, args) {
        clearWelcome();
        if (cmd === 'help') { userMsg('/help', true); helpCard(); return; }
        vsc.postMessage({ type: 'slash', cmd: cmd, args: args });
    }

    function runAgentCommand(c, inputText) {
        clearWelcome();
        vsc.postMessage({ type: 'agent_command', name: c.actual,
            input: inputText || '' });
    }

    function submit() {
        var raw = input.value.replace(/\s+$/, '');
        if (!raw.trim()) return;
        input.value = ''; autosize();
        body.classList.remove('slashing');
        history.push(raw); histIdx = history.length;
        statusline.textContent = '';
        var m = raw.match(/^\/([A-Za-z][\w-]*)\s*([\s\S]*)$/);
        if (m) {
            var cmd = m[1].toLowerCase();
            var offered = commandNamed(cmd);
            if (offered && offered.agent) {
                runAgentCommand(offered, m[2].trim()); return;
            }
            if (offered) { runSlash(cmd, m[2].trim()); return; }
            userMsg(raw, true);
            sysline('unknown command /' + cmd + ' — /help lists them', true);
            return;
        }
        clearWelcome();
        vsc.postMessage({ type: 'send', text: raw });
    }

    input.addEventListener('input', function () { autosize(); updateSlash(); });
    input.addEventListener('keydown', function (ev) {
        if (body.classList.contains('slashing')) {
            if (ev.key === 'ArrowDown') { ev.preventDefault(); moveSlash(1); return; }
            if (ev.key === 'ArrowUp') { ev.preventDefault(); moveSlash(-1); return; }
            if (ev.key === 'Tab') { ev.preventDefault(); acceptSlash(undefined, false); return; }
            if (ev.key === 'Enter' && !ev.shiftKey) {
                ev.preventDefault(); acceptSlash(undefined, true); return;
            }
            if (ev.key === 'Escape') { body.classList.remove('slashing'); return; }
        }
        /* Esc is the way out of a turn from the keyboard: the palette closes
         * first if it is open, otherwise the turn in flight is cancelled. */
        if (ev.key === 'Escape') {
            if (body.classList.contains('running')) {
                ev.preventDefault();
                vsc.postMessage({ type: 'cancel' });
            }
            return;
        }
        if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); submit(); return; }
        if (ev.key === 'ArrowUp' && !input.value && history.length) {
            ev.preventDefault();
            histIdx = Math.max(0, histIdx - 1);
            input.value = history[histIdx] || '';
            autosize();
            return;
        }
        if (ev.key === 'ArrowDown' && histIdx < history.length - 1 && input.value) {
            ev.preventDefault();
            histIdx = Math.min(history.length - 1, histIdx + 1);
            input.value = history[histIdx] || '';
            autosize();
        }
    });
    document.getElementById('send').addEventListener('click', submit);
    document.getElementById('stop').addEventListener('click', function () {
        vsc.postMessage({ type: 'cancel' });
    });
    retryBtn.addEventListener('click', function () { runSlash('retry', ''); });
    /* Cancel must be reachable even when the focus has wandered out of the
     * composer — a permission button, a diff, the transcript. */
    document.addEventListener('keydown', function (ev) {
        if (ev.key !== 'Escape' || ev.target === input) return;
        if (body.classList.contains('slashing')) {
            body.classList.remove('slashing'); return;
        }
        if (body.classList.contains('running')) {
            ev.preventDefault();
            vsc.postMessage({ type: 'cancel' });
        }
    });
    taskChip.addEventListener('click', function () {
        vsc.postMessage({ type: 'slash', cmd: 'task', args: '' });
    });
    driverSel.addEventListener('change', function () {
        vsc.postMessage({ type: 'driver', value: driverSel.value });
        setDrivers(null, driverSel.value);
    });
    configureBtn.addEventListener('click', function () {
        vsc.postMessage({ type: 'configure' });
    });
    /* The Codify toolbar: one click per cg command, so the loop (brief →
     * next → review/check/guard → done) never needs the slash palette. Task
     * actions live in #taskactions and show only while a task is attached. */
    var CG_ACTIONS = [
        { n: 'brief',   g: '◈', d: 'cg brief — session state into the chat' },
        { n: 'next',    g: '▹', d: 'cg spec next — next eligible task' },
        { n: 'status',  g: '☷', d: 'cg spec status — the board' },
        { n: 'review',  g: '⚖', d: 'cg review — change vs acceptance criteria' },
        { n: 'check',   g: '✔', d: 'cg check — the gate' },
        { n: 'guard',   g: '⛨', d: 'cg guard — edits vs task scope' },
        { n: 'changes', g: '◬', d: 'cg changes — blast radius of uncommitted edits' },
        { n: 'remember', g: '✎', d: 'cg remember — save a decision', fill: true },
        { n: 'implemented', g: '◐', task: true,
            d: 'cg spec implemented — mark coded, qualification pending' },
        { n: 'done', g: '●', task: true, cls: 'done',
            d: 'cg spec done — qualify: verify_cmd and graph checks must pass' },
        { n: 'handoff', g: '⇥', task: true, d: 'cg handoff — record where you stopped' },
    ];
    CG_ACTIONS.forEach(function (a, i) {
        var b = el('button', 'cgbtn' + (a.cls ? ' ' + a.cls : ''));
        b.type = 'button';
        b.title = a.d;
        b.dataset.cmd = a.n;
        b.appendChild(el('span', 'g', a.g));
        b.appendChild(el('span', 't', a.n));
        b.addEventListener('click', function () {
            if (a.fill) {
                input.value = '/' + a.n + ' ';
                input.focus(); autosize();
                return;
            }
            runSlash(a.n, '');
        });
        if (a.task) {
            if (!taskActions.children.length) taskActions.appendChild(el('span', 'sep'));
            taskActions.appendChild(b);
        } else {
            cgbar.insertBefore(b, taskActions);
        }
    });
    historySel.addEventListener('change', function () {
        var option = historySel.children[historySel.selectedIndex];
        if (!historySel.value) return;
        vsc.postMessage({ type: 'load_session', sessionId: historySel.value,
            driver: option && option.dataset.driver });
        historySel.value = '';
    });
    refreshHistory.addEventListener('click', function () {
        vsc.postMessage({ type: 'refresh_sessions' });
    });
    modeSel.addEventListener('change', function () {
        vsc.postMessage({ type: 'set_mode', modeId: modeSel.value });
    });

    function setModes(current, modes) {
        if (Array.isArray(modes) && modes.length) {
            modeSel.textContent = '';
            modes.forEach(function (m) {
                var o = el('option', null, m.name || m.id);
                o.value = m.id; o.title = m.description || '';
                modeSel.appendChild(o);
            });
            modeWrap.classList.remove('hidden');
        }
        if (current) modeSel.value = current;
    }

    function setConfigs(options) {
        configs.textContent = '';
        (options || []).forEach(function (o) {
            if (!o || !o.id) return;
            var label = el('label', 'configitem', o.name || o.id);
            var select = el('select');
            select.title = o.description || o.name || o.id;
            if (o.type === 'boolean') {
                ['true', 'false'].forEach(function (value) {
                    var opt = el('option', null, value);
                    opt.value = value; select.appendChild(opt);
                });
                select.value = String(!!o.currentValue);
            } else {
                (o.options || []).forEach(function (value) {
                    var opt = el('option', null, value.name || value.value || value.id);
                    opt.value = value.value || value.id;
                    select.appendChild(opt);
                });
                select.value = o.currentValue || '';
            }
            select.addEventListener('change', function () {
                vsc.postMessage({ type: 'set_config', configId: o.id,
                    value: o.type === 'boolean' ? select.value === 'true' : select.value,
                    valueType: o.type });
            });
            label.appendChild(select); configs.appendChild(label);
        });
    }

    function setSessions(rows, note, loading) {
        historySel.textContent = '';
        var first = el('option', null, loading ? 'Loading sessions…' :
            rows && rows.length ? 'Past sessions' : note || 'No past sessions');
        first.value = ''; first.disabled = true; first.selected = true;
        historySel.appendChild(first);
        (rows || []).forEach(function (row) {
            var title = row.title || row.sessionId;
            var when = row.updatedAt ? new Date(row.updatedAt) : null;
            var stamp = when && !isNaN(when.getTime()) ? ' · ' + when.toLocaleDateString() : '';
            var option = el('option', null, title + ' · ' + (row.driver || 'agent') + stamp);
            option.value = row.sessionId; option.dataset.driver = row.driver || '';
            option.title = row.sessionId;
            historySel.appendChild(option);
        });
        historySel.title = note || 'Past agent sessions';
    }

    /* ---------------- extension messages ---------------- */
    function setTask(task) {
        if (task && task.id) {
            taskChip.textContent = task.id + '  ' + (task.title || '');
            taskChip.title = 'Attached task — click to attach a different one';
            taskChip.classList.add('attached');
            taskStatus.textContent = task.status || '';
            taskStatus.className = 'pill ' + (task.status || '');
            taskActions.classList.remove('hidden');
            body.classList.add('tasked');
        } else {
            taskActions.classList.add('hidden');
            body.classList.remove('tasked');
            taskChip.textContent = 'no task';
            taskChip.title = 'Attach a spec task to this chat';
            taskChip.classList.remove('attached');
            taskStatus.textContent = '';
            taskStatus.className = 'pill';
        }
    }

    function resetTranscript(sub) {
        log.textContent = '';
        tools.clear(); planCard = null; breakBlocks();
        agentCommands = [];
        configs.textContent = ''; modeSel.textContent = '';
        modeWrap.classList.add('hidden'); sessionbar.classList.add('hidden');
        sessionTitle.textContent = ''; usage.textContent = '';
        mcpState.textContent = 'MCP connecting'; mcpState.classList.remove('connected');
        usageBar.classList.add('hidden'); usageFill.style.width = '0';
        activity = { live: false, running: false, connected: false, queued: 0,
            toolStatus: {}, agentStatus: {}, planDone: 0, planTotal: 0, permits: 0 };
        turn = null; timelineDots.clear(); toolTimeline.textContent = '';
        toolTimeline.classList.add('hidden'); setNow('');
        sessionCost = null; showSessionCost(null);
        updateActivity();
        statusline.textContent = '';
        body.classList.remove('running', 'live', 'hasretry');
        driverSel.disabled = false;
        welcome(sub);
        toBottom();
    }

    window.addEventListener('message', function (ev) {
        var m = ev.data || {};
        if (m.type === 'init') {
            if (m.adapters) adapters = m.adapters;
            if (m.diffStyle) diffStyle = m.diffStyle;
            setDrivers(m.drivers, m.driver);
            if (m.version) buildVersion.textContent = 'v' + m.version;
            if (m.feature) document.getElementById('ctxfeature').textContent = m.feature;
            setTask(m.task);
            if (m.idle && !log.childElementCount) welcome();
        } else if (m.type === 'board') {
            document.getElementById('ctxfeature').textContent =
                m.feature ? m.feature + (m.mode ? ' · ' + m.mode : '') : 'codify';
        } else if (m.type === 'task') {
            setTask(m.task);
        } else if (m.type === 'adapter') {
            if (m.adapters) adapters = m.adapters;
            setDrivers(Object.keys(adapters), m.driver);
        } else if (m.type === 'session') {
            body.classList.toggle('live', !!m.live);
            driverSel.disabled = !!m.live;
            sessionbar.classList.toggle('hidden', !m.live);
            activity.live = !!m.live;
            if (!m.live) activity.connected = false;
            updateActivity();
        } else if (m.type === 'connection') {
            sessionbar.classList.remove('hidden');
            activity.connected = true; updateActivity();
            var info = m.agent || {};
            sessionTitle.textContent = info.title || info.name || '';
            mcpState.textContent = (m.mcpServers || []).length
                ? 'MCP · ' + m.mcpServers.join(', ') : 'MCP unavailable';
            mcpState.classList.toggle('connected', !!(m.mcpServers || []).length);
        } else if (m.type === 'mode') {
            setModes(m.currentModeId, m.modes);
        } else if (m.type === 'config') {
            setConfigs(m.options);
        } else if (m.type === 'agent_commands') {
            agentCommands = Array.isArray(m.commands) ? m.commands : [];
        } else if (m.type === 'session_info') {
            if (m.title !== undefined) sessionTitle.textContent = m.title || '';
        } else if (m.type === 'usage') {
            var pct = m.size ? Math.min(100, Math.round(m.used * 100 / m.size)) : 0;
            usage.textContent = m.size ? 'context ' + pct + '%' : '';
            usage.title = m.size ? m.used + ' / ' + m.size + ' tokens' : '';
            usageBar.classList.toggle('hidden', !m.size);
            usageBar.title = usage.title;
            usageFill.style.width = pct + '%';
            usageBar.classList.toggle('high', pct >= 70 && pct < 90);
            usageBar.classList.toggle('full', pct >= 90);
            if (m.session) {
                sessionCost = { cost: m.session.cost, tokens: m.session.tokens,
                    currency: m.session.currency, turns: sessionCost && sessionCost.turns };
                showSessionCost(null);
            }
        } else if (m.type === 'sessions') {
            setSessions(m.sessions || [], m.note, !!m.loading);
        } else if (m.type === 'reset') {
            if (m.driver) setDrivers(null, m.driver);
            setTask(null);
            resetTranscript();
        } else if (m.type === 'session_end') {
            body.classList.remove('running', 'live');
            sessionbar.classList.add('hidden');
            driverSel.disabled = false;
            activity.live = false; activity.running = false; updateActivity();
            breakBlocks();
            sysline('session ended' + (m.why ? ' — ' + m.why : '') +
                ' · your next message starts a fresh one');
        } else if (m.type === 'chunk') {
            if (m.role === 'agent') agentStream(m.text);
            else if (m.role === 'thought') thoughtStream(m.text);
            else if (m.harness) harnessNote(m.harness, m.text || '');
            else {
                /* a prompt has gone out, so there is now something to retry */
                body.classList.add('hasretry');
                userMsg(m.text, !!m.cmd);
            }
        } else if (m.type === 'tool') toolCard(m.call);
        else if (m.type === 'plan') plan(m.entries || []);
        else if (m.type === 'permission') permission(m);
        else if (m.type === 'permission_done') {
            var card = log.querySelector('.perm[data-pid="' + m.pid + '"]');
            if (card) {
                card.classList.add('answered');
                var a = card.querySelector('.answer');
                if (a) a.textContent = m.answer || card.dataset.answer || 'answered';
            }
            activity.permits = Math.max(0, activity.permits - 1); updateActivity();
        } else if (m.type === 'cmdout') cmdCard(m);
        else if (m.type === 'turn') {
            body.classList.toggle('running', !!m.running);
            activity.running = !!m.running; updateActivity();
            if (m.running) beginTurn();
            else {
                breakBlocks();
                endTurn(m.stopReason || 'end_turn', m.ledger);
                if (m.stopReason && m.stopReason !== 'end_turn' &&
                    m.stopReason !== 'error') {
                    sysline('turn ended: ' + m.stopReason);
                }
            }
        } else if (m.type === 'error') {
            errorCard(m);
        } else if (m.type === 'sessionlist') {
            sessionsCard(m);
        } else if (m.type === 'task_status') {
            taskStatus.textContent = m.status;
            taskStatus.className = 'pill ' + m.status;
        } else if (m.type === 'status') {
            statusline.textContent = m.text || '';
        } else if (m.type === 'notice') {
            sysline(m.text || '');
        } else if (m.type === 'queue') {
            activity.queued = Number(m.count) || 0; updateActivity();
        } else if (m.type === 'focus') {
            input.focus();
        }
    });

    welcome();
    autosize();
    vsc.postMessage({ type: 'ready' });
})();
</script>
</body>
</html>
