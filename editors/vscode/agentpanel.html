<!DOCTYPE html>
<!-- Codify agent chat. Rendered inside a VS Code webview view (sidebar) or an
     editor panel; all styling comes from the editor's theme variables so the
     chat is native in any theme. ${cspSource} and ${nonce} are substituted by
     acp.js at load time. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'nonce-${nonce}'; script-src 'nonce-${nonce}';">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Codify agent</title>
<style nonce="${nonce}">
  * { box-sizing: border-box; }
  html, body {
    height: 100%; margin: 0; padding: 0;
    min-width: 0; overflow: hidden;
    background: var(--vscode-sideBar-background, var(--vscode-editor-background));
    color: var(--vscode-foreground);
    font-family: var(--vscode-font-family);
    font-size: var(--vscode-font-size, 13px);
  }
  #root { display: flex; flex-direction: column; height: 100%; min-height: 0; }
  .hidden { display: none !important; }
  @keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
  .msg, .card, details.thought, .sysline { animation: rise 0.16s ease-out; }

  /* ---- context bar ---- */
  #ctxbar {
    display: flex; align-items: center; gap: 6px;
    padding: 5px 8px; min-height: 30px;
    border-bottom: 1px solid var(--vscode-panel-border, rgba(128,128,128,0.25));
    font-size: 0.92em;
  }
  #ctxbar > * { min-width: 0; }
  .dot {
    width: 7px; height: 7px; border-radius: 50%; flex: none;
    background: var(--vscode-descriptionForeground);
  }
  body.live .dot { background: var(--vscode-testing-iconPassed, #3fb950); box-shadow: 0 0 0 3px rgba(63,185,80,0.18); }
  body.running .dot { background: var(--vscode-charts-yellow, #d29922); box-shadow: 0 0 0 3px rgba(210,153,34,0.2); animation: pulse 1.4s ease-in-out infinite; }
  #ctxfeature {
    font-family: var(--vscode-editor-font-family);
    color: var(--vscode-descriptionForeground);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    max-width: 40%;
  }
  #buildversion {
    color: var(--vscode-descriptionForeground);
    font-family: var(--vscode-editor-font-family); font-size: 0.82em;
    white-space: nowrap;
  }
  #history { max-width: 190px; min-width: 105px; }
  #refreshhistory, #configure { padding: 1px 5px; }
  #driver { font-weight: 500; }
  .grow { flex: 1 1 auto; }
  .chip {
    display: inline-flex; align-items: center; gap: 5px;
    background: transparent; color: var(--vscode-foreground);
    border: 1px dashed var(--vscode-panel-border, rgba(128,128,128,0.4));
    border-radius: 10px; padding: 1px 8px; cursor: pointer;
    font-family: inherit; font-size: 0.92em; max-width: 55%;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .chip:hover { background: var(--vscode-toolbar-hoverBackground, rgba(128,128,128,0.15)); }
  .chip.attached {
    border-style: solid;
    border-color: var(--vscode-textLink-foreground, #4a9eda);
    color: var(--vscode-textLink-foreground, #4a9eda);
  }
  .pill {
    font-size: 0.85em; padding: 0 7px; border-radius: 9px; white-space: nowrap;
    border: 1px solid var(--vscode-panel-border, rgba(128,128,128,0.4));
    color: var(--vscode-descriptionForeground);
  }
  .pill:empty { display: none; }
  .pill.done, .pill.implemented {
    color: var(--vscode-testing-iconPassed, #3fb950);
    border-color: var(--vscode-testing-iconPassed, #3fb950);
  }
  .pill.in_progress { color: var(--vscode-charts-yellow, #d29922); }
  select {
    background: var(--vscode-dropdown-background, var(--vscode-input-background));
    color: var(--vscode-dropdown-foreground, var(--vscode-foreground));
    border: 1px solid var(--vscode-dropdown-border, var(--vscode-panel-border));
    border-radius: 3px; padding: 1px 4px; font-family: inherit; font-size: 0.9em;
  }
  select:disabled { opacity: 0.6; }
  select:focus-visible, button:focus-visible, textarea:focus-visible,
  [tabindex]:focus-visible {
    outline: 1px solid var(--vscode-focusBorder); outline-offset: 1px;
  }
  #sessionbar {
    display: flex; align-items: center; gap: 7px; flex-wrap: wrap;
    padding: 4px 8px;
    border-bottom: 1px solid var(--vscode-panel-border, rgba(128,128,128,0.2));
    color: var(--vscode-descriptionForeground); font-size: 0.86em;
  }
  #sessiontitle {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    max-width: 220px; color: var(--vscode-foreground);
  }
  #mcpstate.connected { color: var(--vscode-testing-iconPassed, #3fb950); }
  #usagebar {
    display: inline-block; width: 64px; height: 5px; border-radius: 3px; flex: none;
    background: var(--vscode-progressBar-background, rgba(128,128,128,0.25)); opacity: 0.55;
    overflow: hidden; vertical-align: middle;
  }
  #usagefill {
    display: block; height: 100%; width: 0; border-radius: 3px;
    background: var(--vscode-textLink-foreground, #4a9eda); transition: width 0.3s ease;
  }
  #usagebar.high #usagefill { background: var(--vscode-charts-yellow, #d29922); }
  #usagebar.full #usagefill { background: var(--vscode-testing-iconFailed, #f85149); }
  #configs { display: contents; }
  .configitem { display: inline-flex; align-items: center; gap: 4px; }
  .configitem select { max-width: 150px; }

  /* ---- live activity ---- */
  #activitybar {
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    min-height: 27px; padding: 4px 8px;
    border-bottom: 1px solid var(--vscode-panel-border, rgba(128,128,128,0.18));
    color: var(--vscode-descriptionForeground); font-size: 0.86em;
  }
  #activitybar .label { color: var(--vscode-foreground); font-weight: 500; }
  #activitybar .metric {
    border-left: 1px solid var(--vscode-panel-border, rgba(128,128,128,0.35));
    padding-left: 6px; white-space: nowrap;
  }
  #activitybar .attention { color: var(--vscode-charts-yellow, #d29922); }
  #activitybar { overflow: hidden; }
  #tooltimeline {
    display: inline-flex; gap: 3px; align-items: center; flex-wrap: nowrap;
    flex: 0 1 auto; min-width: 0; max-width: 100%; height: 11px; overflow: hidden;
  }
  #tooltimeline .more {
    flex: none; font-size: 0.8em; color: var(--vscode-descriptionForeground);
    padding-right: 2px; white-space: nowrap;
  }
  .tdot {
    width: 9px; height: 9px; border-radius: 50%; padding: 0; border: none; cursor: pointer;
    background: var(--vscode-descriptionForeground); opacity: 0.55; transition: transform 0.12s ease;
  }
  .tdot:hover { transform: scale(1.35); opacity: 1; }
  .tdot.in_progress, .tdot.pending { background: var(--vscode-charts-yellow, #d29922); opacity: 1; animation: pulse 1.2s ease-in-out infinite; }
  .tdot.completed { background: var(--vscode-testing-iconPassed, #3fb950); opacity: 0.9; }
  .tdot.failed { background: var(--vscode-testing-iconFailed, #f85149); opacity: 1; }
  .tdot.agent { border-radius: 2px; }
  #nowline {
    flex: 1 1 100%; color: var(--vscode-foreground); opacity: 0.85;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    font-family: var(--vscode-editor-font-family); font-size: 0.95em;
  }

  /* ---- Codify toolbar ---- */
  #cgbar {
    display: flex; align-items: center; gap: 4px; flex-wrap: wrap;
    padding: 4px 8px;
    border-bottom: 1px solid var(--vscode-panel-border, rgba(128,128,128,0.18));
  }
  .cgbtn {
    display: inline-flex; align-items: center; gap: 4px;
    background: transparent; color: var(--vscode-foreground);
    border: 1px solid transparent; border-radius: 6px; padding: 2px 7px;
    font-family: inherit; font-size: 0.86em; cursor: pointer;
    transition: background 0.12s ease, border-color 0.12s ease;
  }
  .cgbtn:hover { background: var(--vscode-toolbar-hoverBackground, rgba(128,128,128,0.15)); border-color: var(--vscode-panel-border, rgba(128,128,128,0.3)); }
  .cgbtn .g { color: var(--vscode-textLink-foreground, #4a9eda); font-size: 0.95em; }
  #cgbar .sep { width: 1px; height: 14px; background: var(--vscode-panel-border, rgba(128,128,128,0.35)); margin: 0 3px; }
  #taskactions { display: inline-flex; gap: 4px; }
  #taskactions .cgbtn .g { color: var(--vscode-testing-iconPassed, #3fb950); }
  #taskactions .cgbtn.done { border-color: var(--vscode-testing-iconPassed, #3fb950); }

  /* ---- transcript ---- */
  #scroll { flex: 1 1 auto; overflow-y: auto; min-height: 0; position: relative; }
  #log {
    width: 100%; max-width: 900px; margin: 0 auto;
    padding: 12px 12px 6px; display: flex; flex-direction: column; gap: 11px;
  }

  .msg { max-width: 100%; }
  .msg.user {
    align-self: flex-end; max-width: 90%;
    background: var(--vscode-editorWidget-background, rgba(128,128,128,0.14));
    border: 1px solid var(--vscode-panel-border, rgba(128,128,128,0.22));
    border-radius: 10px 10px 3px 10px;
    padding: 6px 10px; white-space: pre-wrap; word-break: break-word;
    line-height: 1.5;
  }
  .msg.user.cmd {
    font-family: var(--vscode-editor-font-family);
    color: var(--vscode-textLink-foreground, #4a9eda);
    border-style: dashed;
  }
  .who {
    display: flex; align-items: center; gap: 6px; margin-bottom: 3px;
    color: var(--vscode-descriptionForeground);
    font-size: 0.85em; letter-spacing: 0.03em; text-transform: lowercase;
  }
  .who .actions { margin-left: auto; opacity: 0; display: flex; gap: 4px; }
  .msg.agent:hover .who .actions { opacity: 1; }
  .md { line-height: 1.55; word-break: break-word; }
  .md > *:first-child { margin-top: 0; }
  .md > *:last-child { margin-bottom: 0; }
  .md p { margin: 0 0 8px; }
  .md h1, .md h2, .md h3, .md h4 {
    margin: 14px 0 6px; line-height: 1.3; font-weight: 600;
  }
  .md h1 { font-size: 1.28em; } .md h2 { font-size: 1.16em; }
  .md h3 { font-size: 1.06em; } .md h4 { font-size: 1em; }
  .md ul, .md ol { margin: 0 0 8px; padding-left: 20px; }
  .md li { margin: 2px 0; }
  .md li > ul, .md li > ol { margin: 3px 0 2px; }
  .md li.task { list-style: none; margin-left: -18px; }
  .md .taskbox {
    display: inline-block; width: 18px;
    color: var(--vscode-descriptionForeground); font-family: var(--vscode-editor-font-family);
  }
  .md li.task.done { color: var(--vscode-descriptionForeground); }
  .md blockquote {
    margin: 0 0 8px; padding: 2px 0 2px 10px;
    border-left: 3px solid var(--vscode-panel-border, rgba(128,128,128,0.4));
    color: var(--vscode-descriptionForeground);
  }
  .md hr {
    border: none; border-top: 1px solid var(--vscode-panel-border, rgba(128,128,128,0.3));
    margin: 12px 0;
  }
  .md code, code.inline {
    font-family: var(--vscode-editor-font-family);
    font-size: 0.92em;
    background: var(--vscode-textCodeBlock-background, rgba(128,128,128,0.16));
    border-radius: 3px; padding: 0.1em 0.35em;
  }
  .md a, .flink {
    color: var(--vscode-textLink-foreground, #4a9eda);
    text-decoration: none; cursor: pointer;
  }
  .md a:hover, .flink:hover { text-decoration: underline; }
  .flink {
    font-family: var(--vscode-editor-font-family); font-size: 0.92em;
    background: none; border: none; padding: 0; font-weight: inherit;
  }
  .tablewrap { overflow-x: auto; margin: 0 0 8px; }
  .md table { border-collapse: collapse; font-size: 0.95em; }
  .md th, .md td {
    border: 1px solid var(--vscode-panel-border, rgba(128,128,128,0.3));
    padding: 3px 8px; text-align: left;
  }
  .md th { background: var(--vscode-editorWidget-background, rgba(128,128,128,0.12)); }

  /* ---- code blocks ---- */
  .codeblock {
    border: 1px solid var(--vscode-panel-border, rgba(128,128,128,0.25));
    border-radius: 5px; margin: 0 0 8px; overflow: hidden;
    background: var(--vscode-textCodeBlock-background, rgba(128,128,128,0.10));
  }
  .codeblock .cbhead {
    display: flex; align-items: center; gap: 6px; padding: 2px 6px 2px 9px;
    border-bottom: 1px solid var(--vscode-panel-border, rgba(128,128,128,0.2));
    color: var(--vscode-descriptionForeground);
    font-family: var(--vscode-editor-font-family); font-size: 0.82em;
  }
  pre {
    margin: 0; padding: 8px 10px; overflow-x: auto;
    font-family: var(--vscode-editor-font-family);
    font-size: var(--vscode-editor-font-size, 12px); line-height: 1.5;
    white-space: pre;
  }
  pre.wrap { white-space: pre-wrap; word-break: break-word; }

  /* ---- cards: tools, permissions, plan, cg output ---- */
  .card {
    border: 1px solid var(--vscode-panel-border, rgba(128,128,128,0.25));
    border-radius: 8px; overflow: hidden;
    background: var(--vscode-editorWidget-background, rgba(128,128,128,0.07));
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .card:hover { box-shadow: 0 1px 4px rgba(0,0,0,0.12); }
  .card .head {
    display: flex; align-items: center; gap: 7px; padding: 5px 9px;
    cursor: default; width: 100%; text-align: left;
    background: none; border: none; color: inherit;
    font-family: inherit; font-size: inherit;
  }
  .card.collapsible .head { cursor: pointer; }
  .card.collapsible .head:hover { background: var(--vscode-toolbar-hoverBackground, rgba(128,128,128,0.12)); }
  .card .glyph {
    flex: none; width: 20px; height: 20px; line-height: 20px; border-radius: 6px;
    text-align: center; font-size: 0.85em;
    color: var(--vscode-foreground);
    background: var(--vscode-toolbar-hoverBackground, rgba(128,128,128,0.18));
  }
  .card.k-read .glyph, .card.k-search .glyph, .card.k-fetch .glyph { color: var(--vscode-textLink-foreground, #4a9eda); }
  .card.k-edit .glyph, .card.k-move .glyph { color: var(--vscode-charts-yellow, #d29922); }
  .card.k-delete .glyph { color: var(--vscode-testing-iconFailed, #f85149); }
  .card.k-execute .glyph { color: var(--vscode-testing-iconPassed, #3fb950); }
  .card.agent .glyph { color: var(--vscode-charts-purple, #a371f7); }
  .card .kind {
    flex: none; font-size: 0.78em; text-transform: uppercase; letter-spacing: 0.04em;
    color: var(--vscode-descriptionForeground);
  }
  .card .elapsed {
    flex: none; font-size: 0.8em; color: var(--vscode-descriptionForeground);
    font-family: var(--vscode-editor-font-family);
  }
  .card .elapsed:empty, .card .kind:empty { display: none; }
  .status.in_progress::before, .status.pending::before { content: "◌ "; animation: pulse 1.2s ease-in-out infinite; }
  .card.tool.completed .head .status::before { content: "✓"; color: var(--vscode-testing-iconPassed, #3fb950); }
  .card.tool.failed .head .status::before { content: "✗"; color: var(--vscode-testing-iconFailed, #f85149); }
  .card .inp { padding: 4px 10px 0; }
  .card .inp summary {
    cursor: pointer; font-size: 0.85em; color: var(--vscode-descriptionForeground); user-select: none;
  }
  .card .inp pre { font-size: 0.9em; margin: 4px 0 6px; border-radius: 5px;
    background: var(--vscode-textCodeBlock-background, rgba(128,128,128,0.12)); }
  .card.agent { border-left: 3px solid var(--vscode-charts-purple, #a371f7); }
  .card .children { display: flex; flex-direction: column; gap: 6px; padding: 6px 8px 6px 14px; }
  .card .children:empty { display: none; }
  .card .children .card { animation: none; }
  .card .agentnote {
    padding: 4px 10px; font-size: 0.86em; color: var(--vscode-descriptionForeground);
  }
  .card .title {
    flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .card .title .sub {
    color: var(--vscode-descriptionForeground);
    font-family: var(--vscode-editor-font-family); font-size: 0.85em;
    margin-left: 6px;
  }
  .card .chev { flex: none; color: var(--vscode-descriptionForeground); font-size: 0.8em; }
  .card .body { border-top: 1px solid var(--vscode-panel-border, rgba(128,128,128,0.2)); }
  .card .body { min-width: 0; overflow: hidden; }
  .card .body > .md { padding: 8px 10px; }
  .card.closed .body { display: none; }
  .card.closed .chev { transform: rotate(-90deg); }
  .chev { display: inline-block; transition: transform 0.12s ease; }
  @media (prefers-reduced-motion: reduce) { .chev { transition: none; } }
  .status { font-size: 0.82em; flex: none; color: var(--vscode-descriptionForeground); }
  .status.pending, .status.in_progress { color: var(--vscode-charts-yellow, #d29922); }
  .status.completed { color: var(--vscode-testing-iconPassed, #3fb950); }
  .status.failed { color: var(--vscode-testing-iconFailed, #f85149); }
  .card.tool.failed { border-color: var(--vscode-testing-iconFailed, #f85149); }
  .locs { display: flex; flex-wrap: wrap; gap: 8px; padding: 6px 10px; }

  pre.del {
    background: var(--vscode-diffEditor-removedTextBackground, rgba(248,81,73,0.14));
    border-left: 2px solid var(--vscode-testing-iconFailed, #f85149);
  }
  pre.add {
    background: var(--vscode-diffEditor-insertedTextBackground, rgba(63,185,80,0.14));
    border-left: 2px solid var(--vscode-testing-iconPassed, #3fb950);
  }

  /* ---- diffs (5.3): real add/remove rows, unified or side by side ---- */
  .diff { border-top: 1px solid var(--vscode-panel-border, rgba(128,128,128,0.2)); }
  .diff .dhead {
    display: flex; align-items: center; gap: 8px; padding: 3px 8px;
    color: var(--vscode-descriptionForeground); font-size: 0.82em;
    font-family: var(--vscode-editor-font-family);
  }
  .diff .dhead .path {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    color: var(--vscode-textLink-foreground, #4a9eda);
    background: none; border: none; padding: 0; cursor: pointer; font: inherit;
  }
  .diff .dhead .path:hover { text-decoration: underline; }
  .diff .plus { color: var(--vscode-testing-iconPassed, #3fb950); }
  .diff .minus { color: var(--vscode-testing-iconFailed, #f85149); }
  .dscroll { overflow-x: auto; max-height: 420px; overflow-y: auto; }
  table.dtable {
    border-collapse: collapse; width: 100%;
    font-family: var(--vscode-editor-font-family);
    font-size: var(--vscode-editor-font-size, 12px); line-height: 1.45;
  }
  table.dtable td { padding: 0 6px; vertical-align: top; white-space: pre; }
  td.dno {
    width: 1%; text-align: right; user-select: none;
    color: var(--vscode-editorLineNumber-foreground, var(--vscode-descriptionForeground));
    opacity: 0.7; border-right: 1px solid var(--vscode-panel-border, rgba(128,128,128,0.18));
  }
  td.dcode { width: 50%; }
  tr.drow.add td.dcode, td.dcode.add {
    background: var(--vscode-diffEditor-insertedTextBackground, rgba(63,185,80,0.14));
  }
  tr.drow.del td.dcode, td.dcode.del {
    background: var(--vscode-diffEditor-removedTextBackground, rgba(248,81,73,0.14));
  }
  tr.drow.add td.dno { background: var(--vscode-diffEditor-insertedLineBackground, rgba(63,185,80,0.07)); }
  tr.drow.del td.dno { background: var(--vscode-diffEditor-removedLineBackground, rgba(248,81,73,0.07)); }
  tr.drow.gap td {
    color: var(--vscode-descriptionForeground); text-align: center;
    font-size: 0.85em; white-space: normal; opacity: 0.75;
    background: var(--vscode-editorWidget-background, rgba(128,128,128,0.08));
  }
  .diff .dcut {
    padding: 3px 8px; font-size: 0.82em;
    color: var(--vscode-descriptionForeground);
  }

  /* ---- terminal output: monospace, ANSI already stripped ---- */
  pre.term {
    background: var(--vscode-terminal-background, var(--vscode-editor-background));
    color: var(--vscode-terminal-foreground, var(--vscode-foreground));
    border-top: 1px solid var(--vscode-panel-border, rgba(128,128,128,0.2));
    max-height: 360px; overflow: auto; white-space: pre;
  }
  .termhead {
    display: flex; align-items: center; gap: 8px; padding: 3px 8px;
    border-top: 1px solid var(--vscode-panel-border, rgba(128,128,128,0.2));
    color: var(--vscode-descriptionForeground); font-size: 0.82em;
    font-family: var(--vscode-editor-font-family);
  }
  .termhead .rc.bad { color: var(--vscode-testing-iconFailed, #f85149); }
  .termhead .rc.good { color: var(--vscode-testing-iconPassed, #3fb950); }

  /* ---- errors in place ---- */
  .card.err { border-left: 3px solid var(--vscode-testing-iconFailed, #f85149); }
  .card.err .glyph { color: var(--vscode-testing-iconFailed, #f85149); }
  .card.err .emsg {
    padding: 6px 10px; word-break: break-word; line-height: 1.5;
  }
  .card.err .eraw { padding: 0 10px 4px; }
  .card.err .eraw summary {
    cursor: pointer; user-select: none; font-size: 0.85em;
    color: var(--vscode-descriptionForeground);
  }
  .card.err .eraw pre {
    margin: 4px 0 0; max-height: 200px; overflow: auto; white-space: pre-wrap;
    border-radius: 5px; font-size: 0.9em;
    background: var(--vscode-textCodeBlock-background, rgba(128,128,128,0.12));
  }
  .card.err .eacts { display: flex; gap: 6px; padding: 0 10px 8px; }

  /* ---- session switcher card ---- */
  .card.sess .row {
    display: flex; align-items: baseline; gap: 8px; width: 100%;
    background: none; border: none; color: inherit; cursor: pointer;
    padding: 4px 10px; text-align: left; font: inherit;
  }
  .card.sess .row:hover { background: var(--vscode-toolbar-hoverBackground, rgba(128,128,128,0.15)); }
  .card.sess .row .t {
    flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .card.sess .row .m {
    flex: none; color: var(--vscode-descriptionForeground); font-size: 0.85em;
  }
  .card.sess .row.current .t { color: var(--vscode-textLink-foreground, #4a9eda); }
  .card.sess .note {
    padding: 4px 10px; color: var(--vscode-descriptionForeground); font-size: 0.88em;
  }

  /* ---- permission keys ---- */
  .card.perm .why {
    padding: 4px 10px 0; font-size: 0.88em;
    color: var(--vscode-descriptionForeground);
  }
  .card.perm.cancelled { border-left-color: var(--vscode-descriptionForeground); }
  #cost { white-space: nowrap; }
  #cost:empty { display: none; }

  .card.perm { border-left: 3px solid var(--vscode-charts-yellow, #d29922); }
  .card.perm .opts { display: flex; gap: 6px; flex-wrap: wrap; padding: 8px 10px; }
  .card.perm.answered .opts { display: none; }
  .card.perm .answer {
    display: none; padding: 6px 10px; font-size: 0.9em;
    color: var(--vscode-descriptionForeground);
  }
  .card.perm.answered .answer { display: block; }

  .card.cg { border-left: 3px solid var(--vscode-textLink-foreground, #4a9eda); }
  .card.cg .head .title { font-family: var(--vscode-editor-font-family); font-size: 0.92em; }

  ul.plan { list-style: none; margin: 0; padding: 6px 10px; }
  ul.plan li { padding: 1px 0 1px 18px; text-indent: -18px; }
  ul.plan li::before { content: "○ "; color: var(--vscode-descriptionForeground); }
  ul.plan li.in_progress::before { content: "◐ "; color: var(--vscode-charts-yellow, #d29922); }
  ul.plan li.completed::before { content: "● "; color: var(--vscode-testing-iconPassed, #3fb950); }
  ul.plan li.completed { color: var(--vscode-descriptionForeground); }

  details.thought { color: var(--vscode-descriptionForeground); font-size: 0.95em; }
  details.thought summary { cursor: pointer; user-select: none; opacity: 0.85; }
  details.thought .body {
    white-space: pre-wrap; word-break: break-word;
    padding: 4px 0 0 14px; line-height: 1.5;
  }

  .sysline {
    color: var(--vscode-descriptionForeground); font-size: 0.88em;
    font-family: var(--vscode-editor-font-family); text-align: center;
    padding: 2px 0;
  }
  .sysline.err { color: var(--vscode-errorForeground, #f85149); text-align: left; }
  details.harness {
    align-self: center; max-width: 92%;
    font-size: 0.86em; color: var(--vscode-descriptionForeground);
    border: 1px dashed var(--vscode-panel-border, rgba(128,128,128,0.35));
    border-radius: 8px; padding: 3px 10px;
  }
  details.harness summary { cursor: pointer; user-select: none; }
  details.harness pre {
    margin: 6px 0 4px; max-height: 240px; overflow: auto; font-size: 0.92em;
    white-space: pre-wrap; border-radius: 5px; padding: 6px 8px;
    background: var(--vscode-textCodeBlock-background, rgba(128,128,128,0.12));
  }
  .sysline.cmdnote { font-family: var(--vscode-editor-font-family); }
  .sysline.turnsum {
    display: flex; justify-content: center; gap: 8px; flex-wrap: wrap;
    padding: 4px 8px; border-radius: 12px; margin: 0 auto;
    border: 1px solid var(--vscode-panel-border, rgba(128,128,128,0.25));
    background: var(--vscode-editorWidget-background, rgba(128,128,128,0.06));
  }
  .sysline.turnsum .bad { color: var(--vscode-testing-iconFailed, #f85149); }
  .sysline.turnsum .good { color: var(--vscode-testing-iconPassed, #3fb950); }
  .sysline.turnsum .cost, .sysline.turnsum .tok {
    font-variant-numeric: tabular-nums;
    color: var(--vscode-foreground, #ccc);
  }
  .card.cg.ok { border-left-color: var(--vscode-testing-iconPassed, #3fb950); }
  .card.cg.bad { border-left-color: var(--vscode-testing-iconFailed, #f85149); }

  /* ---- welcome ---- */
  .welcome { padding: 6px 2px 2px; }
  .welcome h2 { margin: 0 0 4px; font-size: 1.08em; font-weight: 600; }
  .welcome p {
    margin: 0 0 10px; color: var(--vscode-descriptionForeground); line-height: 1.5;
  }
  .quick { display: flex; flex-wrap: wrap; gap: 6px; }
  .quick button {
    background: var(--vscode-button-secondaryBackground, transparent);
    color: var(--vscode-button-secondaryForeground, var(--vscode-foreground));
    border: 1px solid var(--vscode-panel-border, rgba(128,128,128,0.4));
    border-radius: 12px; padding: 3px 10px; cursor: pointer;
    font-family: inherit; font-size: 0.92em;
  }
  .quick button:hover { background: var(--vscode-toolbar-hoverBackground, rgba(128,128,128,0.18)); }
  .quick button .k {
    font-family: var(--vscode-editor-font-family);
    color: var(--vscode-descriptionForeground); margin-right: 5px;
  }

  /* ---- buttons ---- */
  button {
    font-family: inherit; font-size: inherit; cursor: pointer;
    background: var(--vscode-button-background); color: var(--vscode-button-foreground);
    border: none; border-radius: 3px; padding: 3px 12px;
  }
  button:hover { background: var(--vscode-button-hoverBackground); }
  button.secondary {
    background: var(--vscode-button-secondaryBackground, transparent);
    color: var(--vscode-button-secondaryForeground, var(--vscode-foreground));
    border: 1px solid var(--vscode-panel-border, rgba(128,128,128,0.4));
  }
  button.secondary:hover { background: var(--vscode-toolbar-hoverBackground, rgba(128,128,128,0.18)); }
  button.icon {
    background: none; border: none; padding: 1px 5px; border-radius: 3px;
    color: var(--vscode-descriptionForeground); font-size: 0.85em;
  }
  button.icon:hover {
    background: var(--vscode-toolbar-hoverBackground, rgba(128,128,128,0.2));
    color: var(--vscode-foreground);
  }

  /* ---- composer ---- */
  footer { width: 100%; max-width: 900px; margin: 0 auto; padding: 6px 10px 10px; position: relative; }
  #statusline {
    color: var(--vscode-errorForeground, #f85149); font-size: 0.88em;
    white-space: pre-wrap; margin: 0 2px 5px; word-break: break-word;
  }
  #statusline:empty { display: none; }
  .composer {
    border: 1px solid var(--vscode-input-border, var(--vscode-panel-border, rgba(128,128,128,0.4)));
    border-radius: 6px; background: var(--vscode-input-background);
    padding: 5px 6px 4px;
  }
  .composer:focus-within { border-color: var(--vscode-focusBorder); }
  textarea {
    display: block; width: 100%; resize: none; border: none; outline: none;
    background: transparent; color: var(--vscode-input-foreground);
    font-family: inherit; font-size: inherit; line-height: 1.5;
    padding: 4px 3px; max-height: 240px; min-height: 48px; overflow-y: auto;
  }
  textarea::placeholder { color: var(--vscode-input-placeholderForeground, var(--vscode-descriptionForeground)); }
  .crow { display: flex; align-items: center; gap: 6px; padding-top: 4px; }
  .crow .hint {
    color: var(--vscode-descriptionForeground); font-size: 0.85em;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .crow .hint kbd {
    font-family: var(--vscode-editor-font-family);
    border: 1px solid var(--vscode-panel-border, rgba(128,128,128,0.4));
    border-radius: 3px; padding: 0 3px;
  }
  #spin { display: none; color: var(--vscode-descriptionForeground); font-size: 0.85em; }
  body.running #spin { display: inline; }
  body.running #send { display: none; }
  #stop { display: none; }
  body.running #stop { display: inline-block; }
  /* retry is reachable whenever there is something to re-send and the agent
   * is not already working; cancel takes its place while it is */
  #retry { display: none; }
  body.hasretry:not(.running) #retry { display: inline-block; }

  /* ---- slash menu ---- */
  #slashmenu {
    display: none; position: absolute; left: 8px; right: 8px; bottom: 100%;
    max-height: 230px; overflow-y: auto; z-index: 5;
    background: var(--vscode-editorWidget-background, var(--vscode-editor-background));
    border: 1px solid var(--vscode-widget-border, var(--vscode-panel-border, rgba(128,128,128,0.4)));
    border-radius: 6px; padding: 3px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.28);
  }
  body.slashing #slashmenu { display: block; }
  .sitem {
    display: flex; align-items: baseline; gap: 8px; padding: 3px 7px;
    border-radius: 4px; cursor: pointer;
  }
  .sitem .n {
    font-family: var(--vscode-editor-font-family); flex: none;
    color: var(--vscode-textLink-foreground, #4a9eda);
  }
  .sitem .d {
    color: var(--vscode-descriptionForeground); font-size: 0.9em;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .sitem.sel {
    background: var(--vscode-list-activeSelectionBackground, rgba(128,128,128,0.3));
    color: var(--vscode-list-activeSelectionForeground, inherit);
  }
  .sitem.sel .d { color: inherit; opacity: 0.8; }

  /* ---- scroll to bottom ---- */
  #tobottom {
    display: none; position: absolute; right: 14px; bottom: 8px; z-index: 4;
    background: var(--vscode-editorWidget-background, var(--vscode-editor-background));
    color: var(--vscode-foreground);
    border: 1px solid var(--vscode-widget-border, var(--vscode-panel-border, rgba(128,128,128,0.4)));
    border-radius: 12px; padding: 2px 10px; font-size: 0.85em;
    box-shadow: 0 2px 6px rgba(0,0,0,0.25);
  }
  body.scrolled #tobottom { display: block; }

  @media (max-width: 430px) {
    #ctxbar { flex-wrap: wrap; min-height: 34px; }
    #ctxfeature { order: 4; max-width: none; width: 100%; }
    #taskchip { max-width: calc(100% - 100px); }
    #history { flex: 1 1 135px; max-width: none; }
    #sessionbar { align-items: stretch; }
    #sessiontitle { width: 100%; max-width: none; }
    .configitem { flex: 1 1 130px; justify-content: space-between; }
    .configitem select { flex: 1 1 auto; min-width: 0; max-width: none; }
    #log { padding: 10px 8px 5px; }
    .msg.user { max-width: 96%; }
    .cgbtn .t { display: none; }
    .cgbtn { padding: 2px 6px; }
    .card .head { padding: 6px 7px; }
    .card .title { white-space: normal; overflow-wrap: anywhere; }
    .crow { flex-wrap: wrap; }
    .crow .hint { flex: 1 1 100%; order: 3; }
    footer { padding: 5px 7px 8px; }
  }
  @media (min-width: 700px) {
    .msg.user { max-width: 75%; }
    .md { font-size: 1.02em; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<div id="root">
  <header id="ctxbar">
    <span class="dot" id="livedot"></span>
    <span id="ctxfeature">codify</span>
    <span id="buildversion" title="Running Codify extension version"></span>
    <button class="chip" id="taskchip" title="Attach a spec task to this chat">no task</button>
    <span class="pill" id="taskstatus"></span>
    <span class="grow"></span>
    <select id="history" aria-label="Past agent sessions" title="Past agent sessions">
      <option value="">Past sessions</option>
    </select>
    <button id="refreshhistory" class="icon" aria-label="Refresh past sessions"
      title="Refresh past sessions">↻</button>
    <select id="driver" title="Agent provider for the next chat" aria-label="Agent provider"></select>
    <button id="configure" class="icon" aria-label="Configure agent provider"
      title="Configure agent provider and adapter commands">⚙</button>
  </header>

  <div id="sessionbar" class="hidden" aria-live="polite">
    <span id="sessiontitle"></span>
    <span id="mcpstate">MCP connecting</span>
    <span id="usage"></span>
    <span id="cost" title="What this session has cost so far"></span>
    <span id="usagebar" class="hidden"><span id="usagefill"></span></span>
    <label id="modewrap" class="configitem hidden">mode
      <select id="mode" title="Agent session mode"></select>
    </label>
    <span id="configs"></span>
  </div>

  <div id="activitybar" role="status" aria-live="polite">
    <span id="activitylabel" class="label">Ready</span>
    <span id="toolactivity" class="metric hidden"></span>
    <span id="planactivity" class="metric hidden"></span>
    <span id="queueactivity" class="metric attention hidden"></span>
    <span id="permitactivity" class="metric attention hidden"></span>
    <span id="agentactivity" class="metric hidden"></span>
    <span id="tooltimeline" class="hidden" aria-label="Tool calls this turn"></span>
    <span id="nowline" class="hidden"></span>
  </div>

  <div id="cgbar" role="toolbar" aria-label="Codify actions">
    <span id="taskactions" class="hidden"></span>
  </div>

  <div id="scroll">
    <div id="log"></div>
    <button id="tobottom">↓ latest</button>
  </div>

  <footer>
    <div id="statusline"></div>
    <div id="slashmenu"></div>
    <div class="composer">
      <textarea id="input" rows="2"
        placeholder="Ask the agent, or / for Codify commands"></textarea>
      <div class="crow">
        <span class="hint" id="hint"><kbd>/</kbd> commands · <kbd>Enter</kbd> send · <kbd>Esc</kbd> cancel</span>
        <span class="grow"></span>
        <span id="spin">working…</span>
        <button id="retry" class="secondary"
          title="Send the last prompt again (/retry)">↻ Retry</button>
        <button id="stop" class="secondary" title="Cancel this turn (Esc)">Stop</button>
        <button id="send">Send</button>
      </div>
    </div>
  </footer>
</div>

<script nonce="${nonce}">
(function () {
    'use strict';
    var vsc = acquireVsCodeApi();
    var log = document.getElementById('log');
    var scroller = document.getElementById('scroll');
    var input = document.getElementById('input');
    var statusline = document.getElementById('statusline');
    var driverSel = document.getElementById('driver');
    var historySel = document.getElementById('history');
    var refreshHistory = document.getElementById('refreshhistory');
    var buildVersion = document.getElementById('buildversion');
    var modeSel = document.getElementById('mode');
    var modeWrap = document.getElementById('modewrap');
    var sessionbar = document.getElementById('sessionbar');
    var sessionTitle = document.getElementById('sessiontitle');
    var mcpState = document.getElementById('mcpstate');
    var usage = document.getElementById('usage');
    var configs = document.getElementById('configs');
    var activityLabel = document.getElementById('activitylabel');
    var toolActivity = document.getElementById('toolactivity');
    var planActivity = document.getElementById('planactivity');
    var queueActivity = document.getElementById('queueactivity');
    var permitActivity = document.getElementById('permitactivity');
    var taskChip = document.getElementById('taskchip');
    var taskStatus = document.getElementById('taskstatus');
    var slashmenu = document.getElementById('slashmenu');
    var agentActivity = document.getElementById('agentactivity');
    var toolTimeline = document.getElementById('tooltimeline');
    var nowLine = document.getElementById('nowline');
    var usageBar = document.getElementById('usagebar');
    var usageFill = document.getElementById('usagefill');
    var taskActions = document.getElementById('taskactions');
    var configureBtn = document.getElementById('configure');
    var cgbar = document.getElementById('cgbar');
    var costLabel = document.getElementById('cost');
    var retryBtn = document.getElementById('retry');
    var body = document.body;

    var tools = new Map();        /* toolCallId -> card */
    var agentMsg = null;          /* open streaming agent message */
    var thoughtBlock = null;
    var planCard = null;
    var history = [];
    var histIdx = -1;
    var agentCommands = [];
    var adapters = {};            /* driver id -> {label, command} */
    var activity = { live: false, running: false, connected: false, queued: 0,
        toolStatus: {}, agentStatus: {}, planDone: 0, planTotal: 0, permits: 0 };
    var turn = null;              /* per-turn tally for the summary line */
    var timelineDots = new Map(); /* toolCallId -> dot */
    var diffStyle = 'unified';    /* how a diff opens; each one can flip */
    var sessionCost = null;       /* {cost, currency} for the session bar */

    function metric(node, text) {
        node.textContent = text || '';
        node.classList.toggle('hidden', !text);
    }

    function countStatuses(map) {
        var statuses = Object.keys(map).map(function (id) { return map[id]; });
        return {
            n: statuses.length,
            active: statuses.filter(function (s) {
                return s === 'pending' || s === 'in_progress';
            }).length,
            completed: statuses.filter(function (s) { return s === 'completed'; }).length,
            failed: statuses.filter(function (s) { return s === 'failed'; }).length,
        };
    }

    function updateActivity() {
        activityLabel.textContent = activity.running ? 'Agent working' :
            !activity.live ? 'Ready' : activity.connected ? 'Agent ready' : 'Connecting…';
        var agents = countStatuses(activity.agentStatus);
        metric(agentActivity, agents.active ?
            agents.active + ' sub-agent' + (agents.active === 1 ? '' : 's') + ' active' :
            agents.n ? agents.n + ' sub-agent' + (agents.n === 1 ? '' : 's') +
                (agents.failed ? ', ' + agents.failed + ' failed' : '') : '');
        var statuses = Object.keys(activity.toolStatus).map(function (id) {
            return activity.toolStatus[id];
        });
        var active = statuses.filter(function (s) {
            return s === 'pending' || s === 'in_progress';
        }).length;
        var completed = statuses.filter(function (s) { return s === 'completed'; }).length;
        var failed = statuses.filter(function (s) { return s === 'failed'; }).length;
        metric(toolActivity, active ? active + ' tool' + (active === 1 ? '' : 's') + ' active' :
            statuses.length ? completed + ' done' + (failed ? ', ' + failed + ' failed' : '') : '');
        metric(planActivity, activity.planTotal ?
            'plan ' + activity.planDone + '/' + activity.planTotal : '');
        metric(queueActivity, activity.queued ? activity.queued + ' queued' : '');
        metric(permitActivity, activity.permits ? 'permission needed' : '');
    }

    /* ---------------- Codify slash commands ---------------- */
    var COMMANDS = [
        { n: 'brief',    a: '',        d: 'Session state: task, changes, decisions — into the chat' },
        { n: 'next',     a: '',        d: 'Next eligible task on the board' },
        { n: 'task',     a: '[id]',    d: 'Attach a spec task: claim, start, and brief the agent' },
        { n: 'context',  a: '<query>', d: 'One-call code context: symbols, snippets, edges' },
        { n: 'search',   a: '<query>', d: 'Find code by name across the graph' },
        { n: 'impact',   a: '<name>',  d: 'Callers and callees of a symbol' },
        { n: 'why',      a: '<name>',  d: 'Provenance: commits, tasks, decisions' },
        { n: 'changes',  a: '',        d: 'Impact radius of the uncommitted edits' },
        { n: 'review',   a: '',        d: 'Changed symbols vs acceptance criteria + risk' },
        { n: 'tests',    a: '[symbol]',d: 'Tests referencing a symbol, or your changes' },
        { n: 'check',    a: '',        d: 'The gate: render, lint, evidence, tree' },
        { n: 'guard',    a: '',        d: 'Edits vs the attached task\'s declared scope' },
        { n: 'status',   a: '',        d: 'Board status for the active feature' },
        { n: 'implemented', a: '',     d: 'Mark the attached task coded — qualification pending' },
        { n: 'done',     a: '',        d: 'Qualify the attached task: verify_cmd + graph checks' },
        { n: 'remember', a: '<text>',  d: 'Save a decision to project memory' },
        { n: 'handoff',  a: '',        d: 'Record where you stopped on the attached task' },
        { n: 'open',     a: '<path>',  d: 'Open a file in the editor' },
        { n: 'new',      a: '',        d: 'Start a fresh chat' },
        { n: 'sessions', a: '',        d: 'List chats and switch between them' },
        { n: 'cancel',   a: '',        d: 'Stop the turn in flight (Esc)' },
        { n: 'retry',    a: '',        d: 'Send the last prompt again' },
        { n: 'help',     a: '',        d: 'Show these commands' },
    ];
    function allCommands() {
        var local = COMMANDS.slice();
        var localNames = local.map(function (c) { return c.n; });
        return local.concat(agentCommands.map(function (c) {
            var alias = localNames.indexOf(c.name) >= 0 ? 'agent-' + c.name : c.name;
            return { n: alias, a: c.input ? '<input>' : '',
                d: c.description || 'Agent command', agent: true, actual: c.name };
        }));
    }

    function commandNamed(name) {
        return allCommands().find(function (c) { return c.n === name; });
    }

    /* ---------------- scrolling ---------------- */
    function atBottom() {
        return scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 48;
    }
    function toBottom() {
        scroller.scrollTop = scroller.scrollHeight;
        body.classList.remove('scrolled');
    }
    function keep(fn) {
        var stick = atBottom();
        fn();
        if (stick) toBottom();
    }
    scroller.addEventListener('scroll', function () {
        body.classList.toggle('scrolled', !atBottom());
    });
    document.getElementById('tobottom').addEventListener('click', toBottom);

    function el(tag, cls, txt) {
        var e = document.createElement(tag);
        if (cls) e.className = cls;
        if (txt !== undefined) e.textContent = txt;
        return e;
    }
    function add(node) { keep(function () { log.appendChild(node); }); return node; }
    function clearWelcome() {
        var w = document.getElementById('welcome');
        if (w) w.remove();
    }
    function breakBlocks() { agentMsg = null; thoughtBlock = null; }

    /* ---------------- markdown ---------------- */
    var FILE_RE = /((?:[A-Za-z0-9_.@-]+\/)+[A-Za-z0-9_.-]+\.[A-Za-z][A-Za-z0-9]{0,5})(?::(\d+))?/g;

    function linkify(parent, text) {
        var last = 0, m;
        FILE_RE.lastIndex = 0;
        while ((m = FILE_RE.exec(text)) !== null) {
            if (m.index > last) parent.appendChild(document.createTextNode(text.slice(last, m.index)));
            var b = el('button', 'flink', m[0]);
            b.dataset.path = m[1];
            if (m[2]) b.dataset.line = m[2];
            b.addEventListener('click', function () {
                vsc.postMessage({ type: 'open', path: this.dataset.path,
                    line: this.dataset.line ? Number(this.dataset.line) : undefined });
            });
            parent.appendChild(b);
            last = m.index + m[0].length;
        }
        if (last < text.length) parent.appendChild(document.createTextNode(text.slice(last)));
    }

    var INLINE_RE = /(`[^`\n]+`)|(\*\*[^*\n]+\*\*)|(__[^_\n]+__)|(\*[^*\n]+\*)|(~~[^~\n]+~~)|(\[[^\]\n]+\]\([^)\s]+\))/g;

    function inline(parent, text) {
        var last = 0, m;
        INLINE_RE.lastIndex = 0;
        while ((m = INLINE_RE.exec(text)) !== null) {
            if (m.index > last) linkify(parent, text.slice(last, m.index));
            var t = m[0];
            if (t[0] === '`') {
                parent.appendChild(el('code', 'inline', t.slice(1, -1)));
            } else if (t.slice(0, 2) === '**' || t.slice(0, 2) === '__') {
                parent.appendChild(el('strong', null, t.slice(2, -2)));
            } else if (t.slice(0, 2) === '~~') {
                parent.appendChild(el('s', null, t.slice(2, -2)));
            } else if (t[0] === '*') {
                parent.appendChild(el('em', null, t.slice(1, -1)));
            } else {
                var cut = t.indexOf(']('),
                    label = t.slice(1, cut), href = t.slice(cut + 2, -1);
                if (/^https?:/i.test(href)) {
                    var a = el('a', null, label);
                    a.href = '#'; a.title = href; a.dataset.href = href;
                    a.addEventListener('click', function (ev) {
                        ev.preventDefault();
                        vsc.postMessage({ type: 'external', href: this.dataset.href });
                    });
                    parent.appendChild(a);
                } else {
                    var fb = el('button', 'flink', label);
                    var parts = href.split(':');
                    fb.dataset.path = parts[0];
                    if (parts[1] && /^\d+$/.test(parts[1])) fb.dataset.line = parts[1];
                    fb.addEventListener('click', function () {
                        vsc.postMessage({ type: 'open', path: this.dataset.path,
                            line: this.dataset.line ? Number(this.dataset.line) : undefined });
                    });
                    parent.appendChild(fb);
                }
            }
            last = m.index + t.length;
        }
        if (last < text.length) linkify(parent, text.slice(last));
    }

    function codeBlock(code, lang) {
        var box = el('div', 'codeblock');
        var head = el('div', 'cbhead');
        head.appendChild(el('span', null, lang || 'text'));
        head.appendChild(el('span', 'grow'));
        var copy = el('button', 'icon', 'copy');
        copy.addEventListener('click', function () {
            vsc.postMessage({ type: 'copy', text: code });
            copy.textContent = 'copied';
            setTimeout(function () { copy.textContent = 'copy'; }, 1200);
        });
        head.appendChild(copy);
        box.appendChild(head);
        var pre = el('pre', null, code);
        box.appendChild(pre);
        return box;
    }

    function tableFrom(rows) {
        var wrap = el('div', 'tablewrap'), t = el('table');
        var head = el('thead'), hr = el('tr');
        rows[0].forEach(function (c) { var th = el('th'); inline(th, c); hr.appendChild(th); });
        head.appendChild(hr); t.appendChild(head);
        var tb = el('tbody');
        rows.slice(1).forEach(function (r) {
            var tr = el('tr');
            r.forEach(function (c) { var td = el('td'); inline(td, c); tr.appendChild(td); });
            tb.appendChild(tr);
        });
        t.appendChild(tb); wrap.appendChild(t);
        return wrap;
    }
    function splitRow(line) {
        return line.replace(/^\s*\|/, '').replace(/\|\s*$/, '')
            .split('|').map(function (s) { return s.trim(); });
    }

    function renderMd(host, src) {
        host.textContent = '';
        var lines = String(src == null ? '' : src).split('\n');
        var i = 0;
        while (i < lines.length) {
            var line = lines[i];
            if (/^\s*```/.test(line)) {
                var lang = line.replace(/^\s*```/, '').trim();
                var buf = [];
                i++;
                while (i < lines.length && !/^\s*```/.test(lines[i])) { buf.push(lines[i]); i++; }
                i++;
                host.appendChild(codeBlock(buf.join('\n'), lang));
                continue;
            }
            if (/^\s*$/.test(line)) { i++; continue; }
            var h = line.match(/^\s*(#{1,6})\s+(.*)$/);
            if (h) {
                var lvl = Math.min(h[1].length, 4);
                var hd = el('h' + lvl);
                inline(hd, h[2]);
                host.appendChild(hd); i++;
                continue;
            }
            if (/^\s*(?:---+|\*\*\*+|___+)\s*$/.test(line)) {
                host.appendChild(el('hr')); i++;
                continue;
            }
            if (/^\s*\|.*\|\s*$/.test(line) && i + 1 < lines.length &&
                /^\s*\|?[\s:-]+\|[\s:|-]*$/.test(lines[i + 1])) {
                var rows = [splitRow(line)];
                i += 2;
                while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) {
                    rows.push(splitRow(lines[i])); i++;
                }
                host.appendChild(tableFrom(rows));
                continue;
            }
            if (/^\s*>/.test(line)) {
                var q = el('blockquote'), qb = [];
                while (i < lines.length && /^\s*>/.test(lines[i])) {
                    qb.push(lines[i].replace(/^\s*>\s?/, '')); i++;
                }
                inline(q, qb.join('\n'));
                host.appendChild(q);
                continue;
            }
            var lm = line.match(/^\s*([-*+]|\d+[.)])\s+/);
            if (lm) {
                var firstIndent = (line.match(/^\s*/) || [''])[0].length;
                var ordered = /\d/.test(lm[1]);
                var list = el(ordered ? 'ol' : 'ul');
                var stack = [{ indent: firstIndent, list: list, last: null,
                    ordered: ordered }];
                while (i < lines.length) {
                    var im = lines[i].match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/);
                    if (!im) break;
                    var indent = im[1].length, isOrdered = /\d/.test(im[2]);
                    while (stack.length > 1 && indent < stack[stack.length - 1].indent) {
                        stack.pop();
                    }
                    var top = stack[stack.length - 1];
                    if (indent > top.indent && top.last) {
                        var nested = el(isOrdered ? 'ol' : 'ul');
                        top.last.appendChild(nested);
                        top = { indent: indent, list: nested, last: null,
                            ordered: isOrdered };
                        stack.push(top);
                    } else if (indent !== top.indent || isOrdered !== top.ordered) {
                        break;
                    }
                    var li = el('li'), parts = [im[3]];
                    i++;
                    while (i < lines.length && /^\s{2,}\S/.test(lines[i]) &&
                           !/^\s*(?:[-*+]|\d+[.)])\s/.test(lines[i])) {
                        parts.push(lines[i].trim()); i++;
                    }
                    var task = parts.join(' ').match(/^\[([ xX])\]\s+(.*)$/);
                    if (task) {
                        var done = task[1].toLowerCase() === 'x';
                        li.className = 'task' + (done ? ' done' : '');
                        li.appendChild(el('span', 'taskbox', done ? '☑' : '☐'));
                        inline(li, task[2]);
                    } else {
                        inline(li, parts.join(' '));
                    }
                    top.list.appendChild(li); top.last = li;
                }
                host.appendChild(list);
                continue;
            }
            var para = [];
            while (i < lines.length && !/^\s*$/.test(lines[i]) &&
                   !/^\s*```/.test(lines[i]) && !/^\s*(#{1,6})\s/.test(lines[i]) &&
                   !/^\s*([-*+]|\d+[.)])\s/.test(lines[i]) && !/^\s*>/.test(lines[i])) {
                para.push(lines[i]); i++;
            }
            var p = el('p');
            inline(p, para.join('\n'));
            host.appendChild(p);
        }
    }

    /* ---------------- messages ---------------- */
    function userMsg(text, isCmd) {
        clearWelcome();
        breakBlocks();
        var d = el('div', 'msg user' + (isCmd ? ' cmd' : ''), text);
        add(d);
    }

    /* Text the agent harness put in the user role (compaction summaries,
     * local commands, caveats) is context, not something the user said: show
     * it as a quiet collapsed note so the transcript stays honest but calm. */
    function harnessNote(kind, text) {
        clearWelcome();
        breakBlocks();
        if (kind === 'caveat' && !text.trim()) return;
        if (kind === 'command') {
            sysline('local command · /' + text.replace(/^\//, ''), false, 'cmdnote');
            return;
        }
        var d = el('details', 'harness ' + kind);
        d.appendChild(el('summary', null, kind === 'compaction' ?
            '↻ context compacted — the earlier conversation was summarized for the agent' :
            kind === 'system' ? 'system context sent to the agent' : 'harness note'));
        d.appendChild(el('pre', null, text));
        add(d);
    }

    function agentStream(text) {
        clearWelcome();
        if (!agentMsg) {
            thoughtBlock = null;
            var wrap = el('div', 'msg agent');
            var who = el('div', 'who');
            who.appendChild(el('span', null, driverLabel(driverSel.value) || 'agent'));
            var actions = el('div', 'actions');
            var copy = el('button', 'icon', 'copy');
            copy.addEventListener('click', function () {
                vsc.postMessage({ type: 'copy', text: wrap.dataset.raw || '' });
                copy.textContent = 'copied';
                setTimeout(function () { copy.textContent = 'copy'; }, 1200);
            });
            actions.appendChild(copy);
            who.appendChild(actions);
            var md = el('div', 'md');
            wrap.appendChild(who); wrap.appendChild(md);
            wrap.dataset.raw = '';
            add(wrap);
            agentMsg = { wrap: wrap, md: md, pending: false };
        }
        agentMsg.wrap.dataset.raw += text;
        var cur = agentMsg;
        if (!cur.pending) {
            cur.pending = true;
            requestAnimationFrame(function () {
                cur.pending = false;
                keep(function () { renderMd(cur.md, cur.wrap.dataset.raw); });
            });
        }
    }

    function thoughtStream(text) {
        clearWelcome();
        if (!thoughtBlock) {
            agentMsg = null;
            var d = el('details', 'thought');
            var s = el('summary', null, 'thinking');
            var b = el('div', 'body');
            d.appendChild(s); d.appendChild(b);
            add(d);
            thoughtBlock = b;
        }
        keep(function () { thoughtBlock.textContent += text; });
    }

    function sysline(text, isErr, extra) {
        return add(el('div', 'sysline' + (isErr ? ' err' : '') + (extra ? ' ' + extra : ''), text));
    }

    function driverLabel(id) {
        return (adapters[id] && adapters[id].label) || id || '';
    }

    function setDrivers(ids, current) {
        if (Array.isArray(ids) && ids.length) {
            driverSel.textContent = '';
            ids.forEach(function (d) {
                var o = el('option', null, driverLabel(d));
                o.value = d;
                o.title = (adapters[d] && adapters[d].command) || '';
                driverSel.appendChild(o);
            });
        }
        if (current) driverSel.value = current;

        driverSel.title = a ? driverLabel(driverSel.value) + ' · ' + a.command
            : 'Agent provider for the next chat';

    /* ---------------- per-turn transparency ---------------- */
    function beginTurn() {
        turn = { start: Date.now(), tools: 0, failed: 0, agents: 0, files: {} };
        timelineDots.clear();
        toolTimeline.textContent = '';
        toolTimeline.classList.add('hidden');
        activity.toolStatus = {}; activity.agentStatus = {};
        setNow('');
    }

    /* What a turn cost, in the units the adapter reports. Only the adapters
     * that price their turns send a cost, so an absent one means unknown, not
     * free, and nothing is shown rather than a misleading zero. */
    function fmtCost(v, currency) {
        if (typeof v !== 'number' || !isFinite(v) || v <= 0) return '';
        var sym = (currency || 'USD') === 'USD' ? '$' : '';
        var s = v >= 1 ? v.toFixed(2) : v >= 0.01 ? v.toFixed(3) : v.toFixed(4);
        s = s.replace(/(\.\d\d\d*?)0+$/, '$1');   /* $0.250 reads as $0.25 */
        return sym + s + (sym ? '' : ' ' + currency);
    }
    function fmtTokens(n) {
        if (typeof n !== 'number' || !isFinite(n) || n <= 0) return '';
        if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M tokens';
        if (n >= 1000) return Math.round(n / 1000) + 'k tokens';
        return n + ' tokens';
    }

    function endTurn(stopReason, ledger) {
        setNow('');
        showSessionCost(ledger);
        if (!turn) return;
        var t = turn; turn = null;
        var cost = ledger ? fmtCost(ledger.cost, ledger.currency) : '';
        var toks = ledger ? fmtTokens(ledger.tokens) : '';
        if (!t.tools && !t.agents && !cost && !toks) return;
        var secs = ledger && ledger.ms ? Math.round(ledger.ms / 100) / 10 :
            Math.max(0, Math.round((Date.now() - t.start) / 100) / 10);
        var files = Object.keys(t.files).length;
        var line = el('div', 'sysline turnsum');
        line.appendChild(el('span', stopReason === 'end_turn' ? 'good' : 'bad',
            stopReason === 'end_turn' ? '✓ turn complete' : '⚠ ' + (stopReason || 'stopped')));
        if (t.tools || !cost) {
            line.appendChild(el('span', null, t.tools + ' tool' + (t.tools === 1 ? '' : 's') +
                (t.failed ? ' (' + t.failed + ' failed)' : '')));
        }
        if (t.agents) line.appendChild(el('span', null, t.agents + ' sub-agent' + (t.agents === 1 ? '' : 's')));
        if (files) line.appendChild(el('span', null, files + ' file' + (files === 1 ? '' : 's') + ' touched'));
        if (toks) line.appendChild(el('span', 'tok', toks));
        if (cost) {
            var c = el('span', 'cost', cost);
            c.title = 'What this turn cost' +
                (ledger && ledger.sessionCost ?
                    ' · session ' + fmtCost(ledger.sessionCost, ledger.currency) : '');
            line.appendChild(c);
        }
        line.appendChild(el('span', null, secs + 's'));
        add(line);
    }

    /* The running total lives in the session bar, so the price of the whole
     * conversation is visible without scrolling back through turn summaries. */
    function showSessionCost(ledger) {
        if (ledger && (ledger.sessionCost || ledger.sessionTokens)) {
            sessionCost = { cost: ledger.sessionCost, tokens: ledger.sessionTokens,
                currency: ledger.currency, turns: ledger.turns };
        }
        if (!sessionCost) { metric(costLabel, ''); return; }
        var cost = fmtCost(sessionCost.cost, sessionCost.currency);
        var toks = fmtTokens(sessionCost.tokens);
        metric(costLabel, cost || toks);
        costLabel.title = 'Session: ' + (cost ? cost + ' · ' : '') +
            (toks || 'no token count reported') +
            (sessionCost.turns ? ' · ' + sessionCost.turns +
                ' turn' + (sessionCost.turns === 1 ? '' : 's') : '');
    }

    function setNow(text) {
        nowLine.textContent = text ? '▸ ' + text : '';
        nowLine.classList.toggle('hidden', !text);
    }

    function refreshNow() {
        var running = [];
        tools.forEach(function (card) {
            var st = card.dataset.status;
            if (st === 'pending' || st === 'in_progress') running.push(card);
        });
        if (!running.length) { setNow(''); return; }
        var last = running[running.length - 1];
        setNow(last.querySelector('.title').textContent);
    }

    /* ---------------- diffs and terminal output (5.3) ----------------
     * The extension sends diffs as numbered rows and strips ANSI before it
     * posts; this side only draws. The fallback below covers a message that
     * arrives without rows (an older extension, a replayed transcript): the
     * whole old block removed, the whole new block added — honest, if
     * coarse — and the ANSI guard is repeated here so nothing can put
     * escape sequences on screen. */
    var ANSI_RE = /\u001b\[[0-9;?]*[ -\/]*[@-~]|\u001b\][^\u0007\u001b]*(?:\u0007|\u001b\\)|\u001b[@-Z\\-_]/g;
    function clean(text) {
        return String(text == null ? '' : text).replace(ANSI_RE, '')
            .replace(/\r\n/g, '\n').replace(/[^\n]*\r(?!\n)/g, '');
    }

    function fallbackRows(item) {
        var rows = [], i;
        var olds = String(item.oldText || '').split('\n');
        var news = String(item.newText || '').split('\n');
        if (olds.length && olds[olds.length - 1] === '') olds.pop();
        if (news.length && news[news.length - 1] === '') news.pop();
        for (i = 0; i < olds.length; i++) rows.push({ t: 'del', s: olds[i], o: i + 1, n: 0 });
        for (i = 0; i < news.length; i++) rows.push({ t: 'add', s: news[i], o: 0, n: i + 1 });
        return rows;
    }

    function diffCell(row, tr, which) {
        var no = el('td', 'dno', which === 'old'
            ? (row.o ? String(row.o) : '') : (row.n ? String(row.n) : ''));
        var code = el('td', 'dcode' +
            (which === 'old' && row.t === 'del' ? ' del' : '') +
            (which === 'new' && row.t === 'add' ? ' add' : ''),
        (which === 'old' ? (row.t === 'add' ? '' : row.s)
            : (row.t === 'del' ? '' : row.s)));
        tr.appendChild(no); tr.appendChild(code);
    }

    function diffTable(rows, split) {
        var table = el('table', 'dtable');
        rows.forEach(function (row) {
            var tr = el('tr', 'drow ' + row.t);
            if (row.t === 'gap') {
                var td = el('td', null, '⋯ ' + row.s);
                td.colSpan = split ? 4 : 3;
                tr.appendChild(td);
                table.appendChild(tr);
                return;
            }
            if (split) {
                diffCell(row, tr, 'old');
                diffCell(row, tr, 'new');
            } else {
                tr.appendChild(el('td', 'dno', row.o ? String(row.o) : ''));
                tr.appendChild(el('td', 'dno', row.n ? String(row.n) : ''));
                tr.appendChild(el('td', 'dcode',
                    (row.t === 'add' ? '+ ' : row.t === 'del' ? '- ' : '  ') + row.s));
            }
            table.appendChild(tr);
        });
        return table;
    }

    function diffBlock(item) {
        var rows = Array.isArray(item.rows) && item.rows.length
            ? item.rows : fallbackRows(item);
        var added = item.added, removed = item.removed;
        if (added === undefined || removed === undefined) {
            added = rows.filter(function (r) { return r.t === 'add'; }).length;
            removed = rows.filter(function (r) { return r.t === 'del'; }).length;
        }
        var box = el('div', 'diff');
        var head = el('div', 'dhead');
        if (item.path) {
            var pb = el('button', 'path', item.path);
            pb.title = 'Open ' + item.path;
            pb.addEventListener('click', function () {
                vsc.postMessage({ type: 'open', path: item.path });
            });
            head.appendChild(pb);
        } else {
            head.appendChild(el('span', 'path', 'diff'));
        }
        head.appendChild(el('span', 'plus', '+' + added));
        head.appendChild(el('span', 'minus', '−' + removed));
        head.appendChild(el('span', 'grow'));
        var split = diffStyle === 'split';
        var toggle = el('button', 'icon', split ? 'unified' : 'split');
        var scroll = el('div', 'dscroll');
        scroll.appendChild(diffTable(rows, split));
        toggle.title = 'Switch between one column and old beside new';
        toggle.addEventListener('click', function () {
            split = !split;
            toggle.textContent = split ? 'unified' : 'split';
            keep(function () {
                scroll.textContent = '';
                scroll.appendChild(diffTable(rows, split));
            });
        });
        head.appendChild(toggle);
        box.appendChild(head);
        box.appendChild(scroll);
        if (item.truncated) {
            box.appendChild(el('div', 'dcut',
                '… ' + item.truncated + ' more row' + (item.truncated === 1 ? '' : 's') +
                ' — open the file for the rest'));
        }
        return box;
    }

    function termBlock(text, meta) {
        var wrap = el('div');
        var m = meta || {};
        if (m.command || m.exitCode !== undefined || m.terminalId) {
            var head = el('div', 'termhead');
            head.appendChild(el('span', null, m.command || m.terminalId || 'terminal'));
            head.appendChild(el('span', 'grow'));
            if (m.exitCode !== undefined && m.exitCode !== null) {
                head.appendChild(el('span',
                    'rc ' + (Number(m.exitCode) === 0 ? 'good' : 'bad'),
                    'exit ' + m.exitCode));
            }
            wrap.appendChild(head);
        }
        wrap.appendChild(el('pre', 'term', clean(text) || '(no output)'));
        return wrap;
    }

    /* ---------------- cards ---------------- */
    function makeCard(cls, glyph, title, sub) {
        var card = el('div', 'card ' + cls);
        var head = el('button', 'head');
        head.type = 'button';
        head.appendChild(el('span', 'glyph', glyph));
        var t = el('span', 'title', title);
        if (sub) t.appendChild(el('span', 'sub', sub));
        head.appendChild(t);
        head.appendChild(el('span', 'status'));
        head.appendChild(el('span', 'chev', '⌄'));
        card.appendChild(head);
        card.appendChild(el('div', 'body'));
        head.addEventListener('click', function () {
            if (card.classList.contains('collapsible')) {
                keep(function () { card.classList.toggle('closed'); });
            }
        });
        return card;
    }

    var KIND_GLYPH = {
        read: '▤', edit: '✎', delete: '⌫', move: '⇄', search: '⌕',
        execute: '❯', think: '◇', fetch: '↧', agent: '⧉', other: '•',
    };
    var KIND_LABEL = {
        read: 'read', edit: 'edit', delete: 'delete', move: 'move', search: 'search',
        execute: 'run', think: 'think', fetch: 'fetch', agent: 'sub-agent', other: '',
    };

    /* A sub-agent is a tool call that runs an agent: ACP has no dedicated
     * variant yet, so accept kind 'agent', the Task/Agent/spawn titles the
     * Claude Code and Codex adapters use, or a delegation-shaped rawInput. */
    function agentLike(call) {
        if (call.kind === 'agent') return true;
        if (/^(task|agent|sub-?agent|spawn[_ ]agent|delegate)\b/i.test(String(call.title || ''))) return true;
        var ri = call.rawInput;
        return !!(ri && typeof ri === 'object' &&
            (ri.subagent_type || ri.agent_type || (ri.prompt && ri.description)));
    }
    function parentOf(call) {
        var meta = call._meta || {};
        return call.parentToolCallId || meta.parentToolCallId || meta.parent_tool_call_id || '';
    }
    function shortJson(v) {
        var text;
        try { text = typeof v === 'string' ? v : JSON.stringify(v, null, 2); } catch (_) { text = String(v); }
        return text.length > 2000 ? text.slice(0, 2000) + '\n…' : text;
    }

    var TIMELINE_MAX = 48;
    function timelineDot(call, card) {
        var dot = timelineDots.get(call.toolCallId);
        if (!dot) {
            /* one row only: older dots fold into a "+N" count on the left */
            var dots = toolTimeline.querySelectorAll('.tdot');
            if (dots.length >= TIMELINE_MAX) {
                var more = toolTimeline.querySelector('.more');
                if (!more) {
                    more = el('span', 'more');
                    toolTimeline.insertBefore(more, toolTimeline.firstChild);
                }
                var oldest = dots[0];
                oldest.remove();
                timelineDots.forEach(function (d, id) {
                    if (d === oldest) timelineDots.delete(id);
                });
                more.dataset.n = String((Number(more.dataset.n) || 0) + 1);
                more.textContent = '+' + more.dataset.n;
                more.title = more.dataset.n + ' earlier tool calls';
            }
            dot = el('button', 'tdot');
            dot.type = 'button';
            dot.addEventListener('click', function () {
                card.classList.remove('closed');
                card.scrollIntoView({ block: 'center' });
            });
            toolTimeline.appendChild(dot);
            timelineDots.set(call.toolCallId, dot);
            toolTimeline.classList.remove('hidden');
        }
        dot.title = card.querySelector('.title').textContent;
        dot.className = 'tdot ' + (card.dataset.status || 'pending') +
            (card.classList.contains('agent') ? ' agent' : '');
    }

    function toolCard(call) {
        clearWelcome();
        breakBlocks();
        var isAgent = agentLike(call);
        var card = tools.get(call.toolCallId);
        if (!card) {
            var kind = isAgent ? 'agent' : (call.kind || 'other');
            card = makeCard('tool collapsible' + (isAgent ? ' agent' : ' closed') + ' k-' + kind,
                KIND_GLYPH[kind] || KIND_GLYPH.other, call.title || (isAgent ? 'sub-agent' : 'tool call'));
            var head = card.querySelector('.head');
            head.insertBefore(el('span', 'kind', KIND_LABEL[kind] || ''), head.querySelector('.status'));
            head.insertBefore(el('span', 'elapsed', ''), head.querySelector('.status'));
            card.dataset.started = String(Date.now());
            var bodyEl0 = card.querySelector('.body');
            bodyEl0.appendChild(el('div', 'children'));
            bodyEl0.appendChild(el('div', 'out'));
            tools.set(call.toolCallId, card);
            var parent = parentOf(call) && tools.get(parentOf(call));
            if (parent) {
                parent.querySelector('.children').appendChild(card);
                parent.dataset.children = String((Number(parent.dataset.children) || 0) + 1);
                var psub = parent.querySelector('.title .sub');
                if (!psub) { psub = el('span', 'sub'); parent.querySelector('.title').appendChild(psub); }
                psub.textContent = parent.dataset.children + ' tool' + (parent.dataset.children === '1' ? '' : 's');
            } else {
                add(card);
            }
            if (turn) { if (isAgent) turn.agents++; else turn.tools++; }
        }
        if (call.kind && !isAgent) {
            card.querySelector('.glyph').textContent = KIND_GLYPH[call.kind] || KIND_GLYPH.other;
            card.querySelector('.kind').textContent = KIND_LABEL[call.kind] || '';
        }
        if (call.title) {
            var tnode = card.querySelector('.title');
            var keepSub = tnode.querySelector('.sub');
            tnode.textContent = call.title;
            if (keepSub) tnode.appendChild(keepSub);
        }
        if (call.status) {
            card.dataset.status = call.status;
            var st = card.querySelector('.status');
            st.textContent = call.status === 'completed' ? '' : call.status;
            st.className = 'status ' + call.status;
            card.classList.toggle('failed', call.status === 'failed');
            card.classList.toggle('completed', call.status === 'completed');
            if (call.status === 'failed') {
                card.classList.remove('closed');
                if (turn && !card.dataset.failedCounted) {
                    card.dataset.failedCounted = '1'; turn.failed++;
                }
            }
            if (call.status === 'completed' || call.status === 'failed') {
                var ms = Date.now() - Number(card.dataset.started || Date.now());
                card.querySelector('.elapsed').textContent = ms >= 100 ?
                    (Math.round(ms / 100) / 10) + 's' : '';
                if (isAgent && call.status === 'completed') card.classList.add('closed');
            }
        } else if (!card.dataset.status) {
            card.dataset.status = 'pending';
        }
        if (call.toolCallId) {
            (isAgent ? activity.agentStatus : activity.toolStatus)[call.toolCallId] = card.dataset.status;
            updateActivity();
            timelineDot(call, card);
        }
        refreshNow();

        var bodyEl = card.querySelector('.body');
        if (call.rawInput !== undefined && !card.querySelector('.inp')) {
            var inp = el('details', 'inp');
            var ri = call.rawInput;
            var isPrompt = isAgent && ri && typeof ri === 'object' && ri.prompt;
            inp.appendChild(el('summary', null, isPrompt ? 'prompt' : 'input'));
            inp.appendChild(el('pre', 'wrap', isPrompt ? String(ri.prompt) : shortJson(ri)));
            bodyEl.insertBefore(inp, bodyEl.firstChild);
            if (isPrompt && ri.description) {
                bodyEl.insertBefore(el('div', 'agentnote', String(ri.description)), inp);
            }
        }

        var payload = [];
        if (Array.isArray(call.content)) payload = call.content;
        var locs = Array.isArray(call.locations) ? call.locations : [];
        if (turn) {
            locs.forEach(function (l) { if (l && l.path) turn.files[l.path] = 1; });
            payload.forEach(function (it) { if (it && it.type === 'diff' && it.path) turn.files[it.path] = 1; });
        }
        if (!payload.length && !locs.length) return;

        var out = card.querySelector('.out');
        out.textContent = '';
        if (locs.length) {
            var row = el('div', 'locs');
            locs.forEach(function (l) {
                if (!l || !l.path) return;
                var b = el('button', 'flink',
                    l.path.split('/').pop() + (l.line ? ':' + l.line : ''));
                b.title = l.path;
                b.addEventListener('click', function () {
                    vsc.postMessage({ type: 'open', path: l.path, line: l.line });
                });
                row.appendChild(b);
            });
            out.appendChild(row);
        }
        var executeLike = call.kind === 'execute' ||
            card.classList.contains('k-execute');
        payload.forEach(function (item) {
            if (!item) return;
            if (item.type === 'diff') {
                out.appendChild(diffBlock(item));
            } else if (item.type === 'content' && item.content &&
                       item.content.type === 'text') {
                /* what a command printed is terminal output, not prose:
                 * monospace, unwrapped, and never re-interpreted as Markdown */
                if (executeLike) {
                    out.appendChild(termBlock(item.content.text, item));
                } else {
                    var toolMd = el('div', 'md');
                    renderMd(toolMd, item.content.text);
                    out.appendChild(toolMd);
                }
            } else if (item.type === 'terminal') {
                out.appendChild(termBlock(item.output, item));
            }
        });
    }

    /* The agent is blocked until one of these buttons is pressed, so the card
     * says what is being asked and stays clickable. The extension settles any
     * ask the turn or the adapter outlives, and reports that here, so no card
     * is ever left waiting on something that can no longer answer. */
    function permission(msg) {
        clearWelcome();
        breakBlocks();
        activity.permits++;
        updateActivity();
        var card = makeCard('perm', '⚑', msg.title || 'Permission request');
        card.dataset.pid = msg.pid;
        card.querySelector('.chev').remove();
        var bodyEl = card.querySelector('.body');
        bodyEl.appendChild(el('div', 'why',
            'The agent is waiting for your answer before it continues.'));
        var opts = el('div', 'opts');
        (msg.options || []).forEach(function (o) {
            var reject = o.kind && o.kind.indexOf('reject') === 0;
            var b = el('button', reject ? 'secondary' : '', o.name || o.optionId);
            b.title = o.kind || '';
            b.addEventListener('click', function () {
                vsc.postMessage({ type: 'permission', pid: msg.pid, optionId: o.optionId });
                card.dataset.answer = o.name || o.optionId;
            });
            opts.appendChild(b);
        });
        bodyEl.appendChild(opts);
        if (msg.note) bodyEl.appendChild(el('div', 'why', msg.note));
        bodyEl.appendChild(el('div', 'answer', ''));
        add(card);
        var first = opts.querySelector('button');
        if (first && atBottom()) first.focus();
    }

    /* A failure belongs in the transcript next to the prompt that hit it:
     * the readable line, the raw message one click away, and retry right
     * there rather than in a notification that has already gone. */
    function errorCard(m) {

    /* ---------------- welcome ---------------- */
    function welcome(subtitle) {

    function helpCard() {
        var card = makeCard('cg collapsible', '?', 'Codify commands');
        var bodyEl = card.querySelector('.body');
        var lines = allCommands().map(function (c) {
            var name = ('/' + c.n + (c.a ? ' ' + c.a : ''));
            while (name.length < 20) name += ' ';
            return name + c.d;
        }).join('\n');
