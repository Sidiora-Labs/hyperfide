<!DOCTYPE html>
<!-- Codify agent panel. Rendered inside a VS Code webview; all styling comes
     from the editor's theme variables so the panel is native in any theme.
     ${cspSource} and ${nonce} are substituted by acp.js at load time. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'nonce-${nonce}'; script-src 'nonce-${nonce}';">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Codify agent</title>
<style nonce="${nonce}">
  * { box-sizing: border-box; }
  html, body {
    height: 100%; margin: 0; padding: 0;
    background: var(--vscode-editor-background);
    color: var(--vscode-foreground);
    font-family: var(--vscode-font-family);
    font-size: var(--vscode-font-size);
  }
  #root { display: flex; flex-direction: column; height: 100%; }
  header {
    padding: 8px 12px; border-bottom: 1px solid var(--vscode-panel-border);
    display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;
  }
  header .task { font-weight: 600; }
  header .who {
    color: var(--vscode-descriptionForeground);
    font-family: var(--vscode-editor-font-family); font-size: 0.85em;
  }
  .pill {
    font-size: 0.8em; padding: 1px 8px; border-radius: 8px;
    border: 1px solid var(--vscode-panel-border);
    color: var(--vscode-descriptionForeground);
  }
  .pill.done, .pill.implemented {
    color: var(--vscode-testing-iconPassed, #3fb950);
    border-color: var(--vscode-testing-iconPassed, #3fb950);
  }
  #log { flex: 1; overflow-y: auto; padding: 10px 12px; }
  .block { margin: 0 0 10px; max-width: 100%; }
  .agent { white-space: pre-wrap; word-break: break-word; line-height: 1.5; }
  .user {
    white-space: pre-wrap; word-break: break-word;
    border-left: 3px solid var(--vscode-textLink-foreground, #4a9eda);
    padding: 4px 10px; color: var(--vscode-descriptionForeground);
    font-family: var(--vscode-editor-font-family); font-size: 0.92em;
  }
  details.thought {
    color: var(--vscode-descriptionForeground); font-size: 0.92em;
  }
  details.thought summary { cursor: pointer; user-select: none; }
  details.thought .body { white-space: pre-wrap; padding: 4px 0 0 14px; }
  .card {
    border: 1px solid var(--vscode-panel-border); border-radius: 4px;
    padding: 6px 10px; margin: 0 0 10px;
    background: var(--vscode-sideBar-background, transparent);
  }
  .card .head { display: flex; gap: 8px; align-items: baseline; }
  .card .kind {
    font-family: var(--vscode-editor-font-family); font-size: 0.8em;
    color: var(--vscode-descriptionForeground);
  }
  .card .title { flex: 1; word-break: break-word; }
  .status { font-size: 0.8em; }
  .status.pending, .status.in_progress { color: var(--vscode-charts-yellow, #d29922); }
  .status.completed { color: var(--vscode-testing-iconPassed, #3fb950); }
  .status.failed { color: var(--vscode-testing-iconFailed, #f85149); }
  pre {
    margin: 6px 0 2px; padding: 6px 8px; overflow-x: auto;
    font-family: var(--vscode-editor-font-family);
    font-size: var(--vscode-editor-font-size, 12px);
    background: var(--vscode-textCodeBlock-background, rgba(128,128,128,0.1));
    border-radius: 3px;
  }
  pre.del { background: var(--vscode-diffEditor-removedTextBackground, rgba(248,81,73,0.15)); }
  pre.add { background: var(--vscode-diffEditor-insertedTextBackground, rgba(63,185,80,0.15)); }
  .perm .opts { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
  button {
    background: var(--vscode-button-background); color: var(--vscode-button-foreground);
    border: none; border-radius: 2px; padding: 4px 12px; cursor: pointer;
    font-family: inherit; font-size: inherit;
  }
  button:hover { background: var(--vscode-button-hoverBackground); }
  button:focus-visible { outline: 1px solid var(--vscode-focusBorder); outline-offset: 1px; }
  button.secondary {
    background: var(--vscode-button-secondaryBackground, transparent);
    color: var(--vscode-button-secondaryForeground, var(--vscode-foreground));
    border: 1px solid var(--vscode-panel-border);
  }
  .perm.answered .opts { display: none; }
  .perm.answered .head::after { content: " · answered"; color: var(--vscode-descriptionForeground); }
  ul.plan { list-style: none; margin: 4px 0 0; padding: 0; }
  ul.plan li { padding: 1px 0; }
  ul.plan li::before { content: "○ "; color: var(--vscode-descriptionForeground); }
  ul.plan li.in_progress::before { content: "◐ "; color: var(--vscode-charts-yellow, #d29922); }
  ul.plan li.completed::before { content: "● "; color: var(--vscode-testing-iconPassed, #3fb950); }
  .turnend {
    color: var(--vscode-descriptionForeground); font-size: 0.85em;
    margin: 0 0 10px; font-family: var(--vscode-editor-font-family);
  }
  footer { border-top: 1px solid var(--vscode-panel-border); padding: 8px 12px; }
  #statusline {
    color: var(--vscode-errorForeground, #f85149); font-size: 0.85em;
    white-space: pre-wrap; margin-bottom: 6px;
  }
  #statusline:empty { display: none; }
  .inputrow { display: flex; gap: 8px; align-items: flex-end; }
  textarea {
    flex: 1; resize: vertical; min-height: 34px; max-height: 160px;
    background: var(--vscode-input-background); color: var(--vscode-input-foreground);
    border: 1px solid var(--vscode-input-border, var(--vscode-panel-border));
    border-radius: 2px; padding: 6px 8px; font-family: inherit; font-size: inherit;
  }
  textarea:focus-visible { outline: 1px solid var(--vscode-focusBorder); }
  #spin { display: none; color: var(--vscode-descriptionForeground); font-size: 0.85em; }
  body.running #spin { display: inline; }
  body.running #send { display: none; }
  #stop { display: none; }
  body.running #stop { display: inline-block; }
</style>
</head>
<body>
<div id="root">
  <header>
    <span class="task" id="tasklabel">agent session</span>
    <span class="pill" id="taskstatus"></span>
    <span class="who" id="who"></span>
  </header>
  <div id="log"></div>
  <footer>
    <div id="statusline"></div>
    <div class="inputrow">
      <textarea id="input" rows="1"
        placeholder="Message the agent… (Enter to send, Shift+Enter for a new line)"></textarea>
      <span id="spin">working…</span>
      <button id="send">Send</button>
      <button id="stop" class="secondary">Stop</button>
    </div>
  </footer>
</div>
<script nonce="${nonce}">
(function () {
    const vsc = acquireVsCodeApi();
    const log = document.getElementById('log');
    const input = document.getElementById('input');
    const statusline = document.getElementById('statusline');
    const tools = new Map();      /* toolCallId -> card element */
    let agentBlock = null;        /* open streaming blocks */
    let thoughtBlock = null;
    let planList = null;

    function scrolled() {
        return log.scrollHeight - log.scrollTop - log.clientHeight < 40;
    }
    function append(el) {
        const stick = scrolled();
        log.appendChild(el);
        if (stick) log.scrollTop = log.scrollHeight;
    }
    function breakBlocks() { agentBlock = null; thoughtBlock = null; }
    function text(el, s) { el.textContent += s; }

    function chunk(role, s) {
        const stick = scrolled();
        if (role === 'agent') {
            thoughtBlock = null;
            if (!agentBlock) {
                agentBlock = document.createElement('div');
                agentBlock.className = 'block agent';
                log.appendChild(agentBlock);
            }
            text(agentBlock, s);
        } else if (role === 'thought') {
            agentBlock = null;
            if (!thoughtBlock) {
                const d = document.createElement('details');
                d.className = 'block thought';
                const sum = document.createElement('summary');
                sum.textContent = 'thinking…';
                const body = document.createElement('div');
                body.className = 'body';
                d.appendChild(sum); d.appendChild(body);
                log.appendChild(d);
                thoughtBlock = body;
            }
            text(thoughtBlock, s);
        } else {
            breakBlocks();
            const d = document.createElement('div');
            d.className = 'block user';
            d.textContent = s;
            log.appendChild(d);
        }
        if (stick) log.scrollTop = log.scrollHeight;
    }

    function toolCard(call) {
        breakBlocks();
        let card = tools.get(call.toolCallId);
        if (!card) {
            card = document.createElement('div');
            card.className = 'card tool';
            card.innerHTML = '<div class="head"><span class="kind"></span>' +
                '<span class="title"></span><span class="status"></span></div>' +
                '<div class="payload"></div>';
            tools.set(call.toolCallId, card);
            append(card);
        }
        if (call.kind) card.querySelector('.kind').textContent = call.kind;
        if (call.title) card.querySelector('.title').textContent = call.title;
        if (call.status) {
            const st = card.querySelector('.status');
            st.textContent = call.status;
            st.className = 'status ' + call.status;
        }
        if (Array.isArray(call.content) && call.content.length) {
            const pay = card.querySelector('.payload');
            pay.textContent = '';
            for (const item of call.content) {
                if (item.type === 'diff') {
                    if (item.oldText) {
                        const o = document.createElement('pre');
                        o.className = 'del'; o.textContent = item.oldText;
                        pay.appendChild(o);
                    }
                    const n = document.createElement('pre');
                    n.className = 'add'; n.textContent = item.newText || '';
                    pay.appendChild(n);
                } else if (item.type === 'content' && item.content &&
                           item.content.type === 'text') {
                    const p = document.createElement('pre');
                    p.textContent = item.content.text;
                    pay.appendChild(p);
                }
            }
        }
    }

    function permission(msg) {
        breakBlocks();
        const card = document.createElement('div');
        card.className = 'card perm';
        card.dataset.pid = msg.pid;
        const head = document.createElement('div');
        head.className = 'head';
        head.textContent = msg.title || 'Permission request';
        const opts = document.createElement('div');
        opts.className = 'opts';
        for (const o of msg.options) {
            const b = document.createElement('button');
            if (o.kind && o.kind.indexOf('reject') === 0) b.className = 'secondary';
            b.textContent = o.name || o.optionId;
            b.addEventListener('click', function () {
                vsc.postMessage({ type: 'permission', pid: msg.pid, optionId: o.optionId });
            });
            opts.appendChild(b);
        }
        card.appendChild(head); card.appendChild(opts);
        append(card);
    }

    function plan(entries) {
        if (!planList) {
            const card = document.createElement('div');
            card.className = 'card';
            const head = document.createElement('div');
            head.className = 'head';
            head.textContent = 'Plan';
            planList = document.createElement('ul');
            planList.className = 'plan';
            card.appendChild(head); card.appendChild(planList);
            append(card);
        }
        planList.textContent = '';
        for (const e of entries) {
            const li = document.createElement('li');
            li.className = e.status || '';
            li.textContent = e.content || e.title || '';
            planList.appendChild(li);
        }
    }

    window.addEventListener('message', function (ev) {
        const m = ev.data || {};
        if (m.type === 'init') {
            document.getElementById('tasklabel').textContent =
                m.task.id + '  ' + m.task.title;
            document.getElementById('who').textContent =
                m.driver + ' · ' + m.agent;
            const st = document.getElementById('taskstatus');
            st.textContent = m.task.status;
            st.className = 'pill ' + m.task.status;
        } else if (m.type === 'chunk') chunk(m.role, m.text);
        else if (m.type === 'tool') toolCard(m.call);
        else if (m.type === 'plan') plan(m.entries);
        else if (m.type === 'permission') permission(m);
        else if (m.type === 'permission_done') {
            const card = log.querySelector('.perm[data-pid="' + m.pid + '"]');
            if (card) card.classList.add('answered');
        } else if (m.type === 'turn') {
            document.body.classList.toggle('running', !!m.running);
            if (!m.running) {
                breakBlocks();
                if (m.stopReason && m.stopReason !== 'end_turn') {
                    const d = document.createElement('div');
                    d.className = 'turnend';
                    d.textContent = '— turn ended: ' + m.stopReason + ' —';
                    append(d);
                }
            }
        } else if (m.type === 'task_status') {
            const st = document.getElementById('taskstatus');
            st.textContent = m.status;
            st.className = 'pill ' + m.status;
        } else if (m.type === 'status') statusline.textContent = m.text;
    });

    function send() {
        const t = input.value.trim();
        if (!t) return;
        input.value = '';
        statusline.textContent = '';
        vsc.postMessage({ type: 'send', text: t });
    }
    document.getElementById('send').addEventListener('click', send);
    document.getElementById('stop').addEventListener('click', function () {
        vsc.postMessage({ type: 'cancel' });
    });
    input.addEventListener('keydown', function (ev) {
        if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); send(); }
    });
})();
</script>
</body>
</html>
