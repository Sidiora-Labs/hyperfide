<!DOCTYPE html>
<!-- Codify memory browser. Rendered inside a VS Code webview panel; every
     colour comes from the editor's theme variables so the panel is native in
     any theme. memories.js substitutes ${nonce} and ${filter} at load time —
     ${filter} is the source of memoryFilter itself, so the panel filters with
     the exact function the test suite drives under node, not a copy. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'nonce-${nonce}'; script-src 'nonce-${nonce}';">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Codify memories</title>
<style nonce="${nonce}">
  * { box-sizing: border-box; }
  html, body {
    height: 100%; margin: 0; padding: 0; overflow: hidden;
    background: var(--vscode-editor-background);
    color: var(--vscode-foreground);
    font-family: var(--vscode-font-family);
    font-size: var(--vscode-font-size, 13px);
  }
  #root { display: flex; flex-direction: column; height: 100%; min-height: 0; }
  .hidden { display: none !important; }
  .grow { flex: 1 1 auto; }
  .muted { color: var(--vscode-descriptionForeground); }
  @keyframes rise { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
  @keyframes slide { from { left: -35%; } to { left: 100%; } }

  /* ---- search bar ---- */
  #bar {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px 6px;
  }
  #q {
    flex: 1 1 auto; min-width: 120px;
    padding: 5px 8px;
    color: var(--vscode-input-foreground);
    background: var(--vscode-input-background);
    border: 1px solid var(--vscode-input-border, transparent);
    border-radius: 4px; outline: none;
    font-family: inherit; font-size: inherit;
    transition: border-color 0.14s ease, box-shadow 0.14s ease;
  }
  #q:focus {
    border-color: var(--vscode-focusBorder);
    box-shadow: 0 0 0 1px var(--vscode-focusBorder);
  }
  #count { white-space: nowrap; font-variant-numeric: tabular-nums; }

  /* ---- filters ---- */
  #filters {
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px;
    padding: 0 12px 8px;
    border-bottom: 1px solid var(--vscode-panel-border, rgba(128,128,128,0.25));
  }
  #filters label {
    display: inline-flex; align-items: center; gap: 4px;
    color: var(--vscode-descriptionForeground); font-size: 0.92em;
  }
  select, input[type="date"] {
    color: var(--vscode-dropdown-foreground, var(--vscode-foreground));
    background: var(--vscode-dropdown-background, var(--vscode-input-background));
    border: 1px solid var(--vscode-dropdown-border, transparent);
    border-radius: 4px; padding: 3px 5px; outline: none;
    font-family: inherit; font-size: inherit; max-width: 190px;
  }
  select:focus, input[type="date"]:focus {
    border-color: var(--vscode-focusBorder);
  }
  button {
    color: var(--vscode-button-foreground);
    background: var(--vscode-button-background);
    border: 1px solid transparent; border-radius: 4px;
    padding: 4px 10px; cursor: pointer;
    font-family: inherit; font-size: inherit;
    transition: background 0.12s ease, opacity 0.12s ease, transform 0.08s ease;
  }
  button:hover { background: var(--vscode-button-hoverBackground); }
  button:active { transform: translateY(1px); }
  button:focus-visible { outline: 1px solid var(--vscode-focusBorder); outline-offset: 1px; }
  button[disabled] { opacity: 0.45; cursor: default; transform: none; }
  button.ghost {
    color: var(--vscode-foreground);
    background: transparent;
    border-color: var(--vscode-button-border, var(--vscode-panel-border, rgba(128,128,128,0.35)));
  }
  button.ghost:hover { background: var(--vscode-toolbar-hoverBackground, rgba(128,128,128,0.15)); }
  button.danger { color: var(--vscode-errorForeground); }

  /* ---- progress, notices, errors ---- */
  #progress {
    position: relative; height: 2px; flex: none; overflow: hidden;
    background: transparent;
  }
  #progress > i {
    position: absolute; top: 0; width: 35%; height: 100%;
    background: var(--vscode-progressBar-background, var(--vscode-focusBorder));
    animation: slide 1.1s ease-in-out infinite;
  }
  .banner {
    display: flex; align-items: center; gap: 8px;
    margin: 8px 12px 0; padding: 6px 10px; border-radius: 4px;
    border-left: 3px solid var(--vscode-focusBorder);
    background: var(--vscode-textBlockQuote-background, rgba(128,128,128,0.1));
    animation: rise 0.16s ease-out;
  }
  .banner.warn { border-left-color: var(--vscode-editorWarning-foreground, #d29922); }
  .banner.error { border-left-color: var(--vscode-errorForeground, #f14c4c); }
  .banner .text { flex: 1 1 auto; min-width: 0; }

  /* ---- panes ---- */
  #panes { display: flex; flex: 1 1 auto; min-height: 0; }
  #listpane {
    flex: 1 1 52%; min-width: 0; min-height: 0; overflow-y: auto;
    border-right: 1px solid var(--vscode-panel-border, rgba(128,128,128,0.25));
  }
  #detailpane { flex: 1 1 48%; min-width: 0; min-height: 0; overflow-y: auto; padding: 14px 16px; }
  #list { list-style: none; margin: 0; padding: 4px 0; }
  #list li {
    padding: 7px 12px; cursor: pointer;
    border-left: 2px solid transparent;
    animation: rise 0.14s ease-out;
    transition: background 0.1s ease;
  }
  #list li:hover { background: var(--vscode-list-hoverBackground); }
  #list li.sel {
    background: var(--vscode-list-activeSelectionBackground);
    color: var(--vscode-list-activeSelectionForeground);
    border-left-color: var(--vscode-focusBorder);
  }
  #list li.sel .meta { color: inherit; opacity: 0.8; }
  .body {
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; line-height: 1.4;
  }
  .meta {
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
    margin-top: 3px; font-size: 0.86em;
    color: var(--vscode-descriptionForeground);
  }
  .chip {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 0 6px; border-radius: 9px; line-height: 1.6;
    background: var(--vscode-badge-background);
    color: var(--vscode-badge-foreground);
    font-size: 0.92em; white-space: nowrap;
  }
  .chip.soft {
    background: transparent; color: inherit;
    border: 1px solid var(--vscode-panel-border, rgba(128,128,128,0.35));
  }

  /* ---- empty states ---- */
  .empty {
    margin: 40px auto; padding: 0 24px; max-width: 420px; text-align: center;
    color: var(--vscode-descriptionForeground); animation: rise 0.18s ease-out;
  }
  .empty h2 { margin: 0 0 6px; font-size: 1.05em; color: var(--vscode-foreground); font-weight: 600; }
  .empty p { margin: 0 0 12px; line-height: 1.5; }
  .empty .acts { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  code {
    font-family: var(--vscode-editor-font-family);
    background: var(--vscode-textCodeBlock-background, rgba(128,128,128,0.15));
    border-radius: 3px; padding: 0 4px;
  }

  /* ---- detail ---- */
  #detailhead { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  #detailbody {
    margin: 12px 0 14px; white-space: pre-wrap; line-height: 1.55;
    font-size: 1.02em;
  }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 0.92em; }
  .kv dt { color: var(--vscode-descriptionForeground); }
  .kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
  .section { margin-top: 14px; }
  .section h3 {
    margin: 0 0 6px; font-size: 0.82em; font-weight: 600; letter-spacing: 0.07em;
    text-transform: uppercase; color: var(--vscode-descriptionForeground);
  }
  .links { display: flex; flex-wrap: wrap; gap: 6px; }
  .link {
    background: transparent; border: 1px solid var(--vscode-panel-border, rgba(128,128,128,0.35));
    color: var(--vscode-textLink-foreground); border-radius: 4px;
    padding: 2px 8px; font-family: var(--vscode-editor-font-family); font-size: 0.9em;
  }
  .link:hover { background: var(--vscode-toolbar-hoverBackground, rgba(128,128,128,0.15)); }
  #actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 18px; }
  #busy { display: flex; align-items: center; gap: 6px; margin-top: 10px; min-height: 18px; }
  #busy .dot {
    width: 7px; height: 7px; border-radius: 50%; flex: none;
    background: var(--vscode-progressBar-background, var(--vscode-focusBorder));
    animation: pulse 1s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

  @media (max-width: 820px) {
    #panes { flex-direction: column; }
    #listpane { flex: 1 1 55%; border-right: none;
      border-bottom: 1px solid var(--vscode-panel-border, rgba(128,128,128,0.25)); }
    #detailpane { flex: 1 1 45%; }
  }
</style>
</head>
<body>
<div id="root">
  <header id="bar">
    <input id="q" type="search" autocomplete="off" spellcheck="false"
           aria-label="Search memories"
           placeholder="Search memories — type to filter, Enter to search every memory with cg">
    <span id="count" class="muted"></span>
    <button id="reload" class="ghost" title="Reload from cg recall">Reload</button>
  </header>

  <div id="filters">
    <label>Type <select id="ftype" aria-label="Filter by type"></select></label>
    <label>Class <select id="fclass" aria-label="Filter by Jev class"></select></label>
    <label>Task <select id="ftask" aria-label="Filter by task"></select></label>
    <label>Branch <select id="fbranch" aria-label="Filter by branch"></select></label>
    <label>From <input id="ffrom" type="date" aria-label="Created on or after"></label>
    <label>To <input id="fto" type="date" aria-label="Created on or before"></label>
    <button id="clear" class="ghost">Clear filters</button>
    <span class="grow"></span>
    <span id="loaded" class="muted"></span>
  </div>

  <div id="progress" class="hidden"><i></i></div>
  <div id="notice" class="banner hidden">
    <span class="text"></span>
    <button class="ghost" id="dismiss">Dismiss</button>
  </div>
  <div id="error" class="banner error hidden">
    <span class="text"></span>
    <button class="ghost" id="retry">Retry</button>
  </div>

  <div id="panes">
    <section id="listpane">
      <ul id="list" role="listbox" aria-label="Memories" tabindex="0"></ul>
      <div id="empty" class="empty hidden"></div>
    </section>
    <section id="detailpane">
      <div id="detail"></div>
    </section>
  </div>
</div>

<script nonce="${nonce}">
/* The filter below is memoryFilter from memories.js, injected verbatim: the
   panel and the test run the same code. */
${filter}

(function () {
    'use strict';
    var vsc = acquireVsCodeApi();

    var el = {
        q: document.getElementById('q'),
        count: document.getElementById('count'),
        loaded: document.getElementById('loaded'),
        reload: document.getElementById('reload'),
        clear: document.getElementById('clear'),
        list: document.getElementById('list'),
        empty: document.getElementById('empty'),
        detail: document.getElementById('detail'),
        progress: document.getElementById('progress'),
        notice: document.getElementById('notice'),
        error: document.getElementById('error'),
        dismiss: document.getElementById('dismiss'),
        retry: document.getElementById('retry'),
        type: document.getElementById('ftype'),
        cls: document.getElementById('fclass'),
        task: document.getElementById('ftask'),
        branch: document.getElementById('fbranch'),
        from: document.getElementById('ffrom'),
        to: document.getElementById('fto'),
    };

    var MAX_ROWS = 300;               /* render a screenful of rows, not a book */
    var saved = vsc.getState() || {};
    var state = {
        memories: [],
        shown: [],
        selected: saved.selected || null,
        source: 'all',
        query: '',
        limit: 0,
        at: 0,
        ready: false,
        busy: {},
        filter: saved.filter || {
            text: '', type: '', class: '', task: '', branch: '', from: '', to: '',
        },
    };

    function persist() {
        try { vsc.setState({ filter: state.filter, selected: state.selected }); }
        catch (e) { /* state is a convenience, never a requirement */ }
    }

    /* ---------------- small DOM helpers (no innerHTML: CSP and safety) ---- */
    function mk(tag, cls, text) {
        var n = document.createElement(tag);
        if (cls) n.className = cls;
        if (text !== undefined && text !== null) n.textContent = String(text);
        return n;
    }
    function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }
    function show(node, on) { node.classList.toggle('hidden', !on); }

    function when(sec) {
        if (!sec) return '';
        var d = new Date(Number(sec) * 1000);
        return isNaN(d.getTime()) ? '' : d.toLocaleString();
    }
    function day(sec) {
        if (!sec) return '';
        var d = new Date(Number(sec) * 1000);
        return isNaN(d.getTime()) ? '' : d.toLocaleDateString();
    }
    function split(v) {
        return String(v || '').split(/[,\s]+/).map(function (s) { return s.trim(); })
            .filter(Boolean);
    }

    /* ---------------- filter bar ---------------- */

    /* Options come from the memories themselves, so the bar can only offer
       filters that can actually match something. */
    function fillSelect(sel, values, anyLabel, noneLabel) {
        var keep = sel.value;
        clear(sel);
        sel.appendChild(new Option(anyLabel, ''));
        if (noneLabel) sel.appendChild(new Option(noneLabel, NONE));
        values.forEach(function (v) { sel.appendChild(new Option(v, v)); });
        sel.value = keep;
        if (sel.value !== keep) sel.value = '';       /* the value vanished */
    }

    function uniq(field) {
        var seen = Object.create(null);
        state.memories.forEach(function (m) {
            var v = m && m[field];
            if (v !== undefined && v !== null && v !== '') seen[String(v)] = true;
        });
        return Object.keys(seen).sort();
    }

    function hasEmpty(field) {
        return state.memories.some(function (m) {
            return !m || m[field] === undefined || m[field] === null || m[field] === '';
        });
    }

    function syncFilterBar() {
        fillSelect(el.type, uniq('type'), 'any', '');
        fillSelect(el.cls, uniq('class'), 'any',
            hasEmpty('class') ? 'unclassified' : '');
        fillSelect(el.task, uniq('task'), 'any', hasEmpty('task') ? 'no task' : '');
        fillSelect(el.branch, uniq('branch'), 'any',
            hasEmpty('branch') ? 'no branch' : '');
        el.type.value = state.filter.type || '';
        el.cls.value = state.filter.class || '';
        el.task.value = state.filter.task || '';
        el.branch.value = state.filter.branch || '';
        el.from.value = state.filter.from || '';
        el.to.value = state.filter.to || '';
        el.q.value = state.filter.text || '';
        /* a select whose value disappeared falls back to "any" */
        state.filter.type = el.type.value;
        state.filter.class = el.cls.value;
        state.filter.task = el.task.value;
        state.filter.branch = el.branch.value;
    }

    function readFilterBar() {
        state.filter = {
            text: el.q.value,
            type: el.type.value,
            class: el.cls.value,
            task: el.task.value,
            branch: el.branch.value,
            from: el.from.value,
            to: el.to.value,
        };
        persist();
    }

    function filtersActive() {
        var f = state.filter;
        return !!(f.text || f.type || f.class || f.task || f.branch || f.from || f.to);
    }

    /* ---------------- rendering ---------------- */

    function render() {
        state.shown = memoryFilter(state.memories, state.filter);
        renderCount();
        renderList();
        renderDetail();
    }

    function renderCount() {
        var total = state.memories.length;
        var n = state.shown.length;
        if (!state.ready) { el.count.textContent = ''; return; }
        el.count.textContent = n === total
            ? total + (total === 1 ? ' memory' : ' memories')
            : n + ' of ' + total;
        el.loaded.textContent = !state.at ? ''
            : (state.source === 'search'
                ? 'cg recall "' + state.query + '"'
                : 'loaded ' + new Date(state.at).toLocaleTimeString()) +
              (state.limit && total >= state.limit ? ' · newest ' + state.limit : '');
    }

    function row(m) {
        var li = mk('li');
        li.setAttribute('role', 'option');
        li.dataset.id = String(m.id);
        if (String(m.id) === String(state.selected)) {
            li.classList.add('sel');
            li.setAttribute('aria-selected', 'true');
        }
        li.appendChild(mk('div', 'body', m.body || '(empty)'));
        var meta = mk('div', 'meta');
        meta.appendChild(mk('span', 'chip', m.type || 'memory'));
        if (m.class) {
            meta.appendChild(mk('span', 'chip soft', m.confidence !== undefined &&
                m.confidence !== null
                ? m.class + ' ' + Math.round(Number(m.confidence) * 100) + '%'
                : m.class));
        }
        if (m.task) meta.appendChild(mk('span', 'chip soft', m.task));
        if (m.branch) meta.appendChild(mk('span', 'chip soft', m.branch));
        meta.appendChild(mk('span', '', day(m.created)));
        meta.appendChild(mk('span', '', '#' + m.id));
        li.appendChild(meta);
        li.addEventListener('click', function () { select(m.id); });
        return li;
    }

    function renderList() {
        clear(el.list);
        if (!state.shown.length) { renderEmpty(); return; }
        show(el.empty, false);
        var frag = document.createDocumentFragment();
        state.shown.slice(0, MAX_ROWS).forEach(function (m) { frag.appendChild(row(m)); });
        el.list.appendChild(frag);
        if (state.shown.length > MAX_ROWS) {
            var more = mk('li', 'muted', 'Showing the first ' + MAX_ROWS + ' of ' +
                state.shown.length + ' — narrow the filters to see the rest.');
            more.style.cursor = 'default';
            el.list.appendChild(more);
        }
    }

    function renderEmpty() {
        clear(el.empty);
        show(el.empty, true);
        var box = el.empty;
        if (!state.ready) {
            box.appendChild(mk('h2', '', 'Loading memories…'));
            box.appendChild(mk('p', '', 'Reading them from cg recall.'));
            return;
        }
        if (!state.memories.length) {
            box.appendChild(mk('h2', '', 'No project memories yet'));
            box.appendChild(mk('p', '',
                'Memories are the decisions, constraints and facts worth knowing in ' +
                'a later session. Write one with cg remember, or Codify: Remember a ' +
                'Decision — they live in .codegraph beside the code graph.'));
            return;
        }
        box.appendChild(mk('h2', '', 'No memory matches'));
        box.appendChild(mk('p', '', state.memories.length +
            ' memories are loaded; none of them match these filters.'));
        var acts = mk('div', 'acts');
        var clr = mk('button', 'ghost', 'Clear filters');
        clr.addEventListener('click', clearFilters);
        acts.appendChild(clr);
        if (state.filter.text) {
            var deep = mk('button', '', 'Search every memory with cg');
            deep.addEventListener('click', deepSearch);
            acts.appendChild(deep);
        }
        box.appendChild(acts);
    }

    function selected() {
        if (state.selected === null) return null;
        var hit = null;
        state.shown.forEach(function (m) {
            if (String(m.id) === String(state.selected)) hit = m;
        });
        return hit;
    }

    function renderDetail() {
        clear(el.detail);
        var m = selected();
        if (!m) {
            var hint = mk('div', 'empty');
            hint.appendChild(mk('h2', '', state.shown.length ? 'Pick a memory' : 'Nothing selected'));
            hint.appendChild(mk('p', '', state.shown.length
                ? 'Its text, links and actions appear here. ↑ and ↓ move through the list.'
                : 'Memories you select appear here with their symbols, files and actions.'));
            el.detail.appendChild(hint);
            return;
        }

        var head = mk('div', '', '');
        head.id = 'detailhead';
        head.appendChild(mk('span', 'chip', m.type || 'memory'));
        if (m.class) {
            head.appendChild(mk('span', 'chip soft', m.confidence !== undefined &&
                m.confidence !== null
                ? m.class + ' · ' + Math.round(Number(m.confidence) * 100) + '% sure'
                : m.class));
        }
        head.appendChild(mk('span', 'muted', '#' + m.id));
        head.appendChild(mk('span', 'muted', when(m.created)));
        el.detail.appendChild(head);

        var body = mk('div', '', m.body || '');
        body.id = 'detailbody';
        el.detail.appendChild(body);

        var kv = mk('dl', 'kv');
        function pair(k, v) {
            if (!v) return;
            kv.appendChild(mk('dt', '', k));
            kv.appendChild(mk('dd', '', v));
        }
        pair('task', m.task);
        pair('branch', m.branch);
        pair('source', m.source);
        if (kv.childNodes.length) el.detail.appendChild(kv);

        linkSection('Symbols', split(m.symbols), function (name) {
            post({ type: 'openSymbol', name: name });
        });
        linkSection('Files', split(m.files), function (file) {
            post({ type: 'openFile', path: file });
        });

        var acts = mk('div', '');
        acts.id = 'actions';
        [
            ['Supersede', 'supersede', 'ghost'],
            ['Classify with Jev', 'classify', 'ghost'],
            ['Promote to skill', 'promote', 'ghost'],
            ['Open SKILL.md', 'openSkill', 'ghost'],
            ['Forget', 'forget', 'ghost danger'],
        ].forEach(function (a) {
            var b = mk('button', a[2], a[0]);
            b.disabled = !!state.busy[m.id];
            b.addEventListener('click', function () { post({ type: a[1], id: m.id }); });
            acts.appendChild(b);
        });
        el.detail.appendChild(acts);

        var busy = mk('div', '');
        busy.id = 'busy';
        if (state.busy[m.id]) {
            busy.appendChild(mk('i', 'dot'));
            busy.appendChild(mk('span', 'muted', state.busy[m.id]));
        }
        el.detail.appendChild(busy);
    }

    function linkSection(title, values, onClick) {
        if (!values.length) return;
        var sec = mk('div', 'section');
        sec.appendChild(mk('h3', '', title));
        var links = mk('div', 'links');
        values.forEach(function (v) {
            var b = mk('button', 'link', v);
            b.addEventListener('click', function () { onClick(v); });
            links.appendChild(b);
        });
        sec.appendChild(links);
        el.detail.appendChild(sec);
    }

    /* ---------------- interaction ---------------- */

    function post(msg) { vsc.postMessage(msg); }

    function select(id) {
        state.selected = id === undefined || id === null ? null : id;
        persist();
        Array.prototype.forEach.call(el.list.children, function (li) {
            var on = li.dataset && li.dataset.id === String(state.selected);
            li.classList.toggle('sel', on);
            if (on) li.setAttribute('aria-selected', 'true');
            else li.removeAttribute('aria-selected');
            if (on && li.scrollIntoView) li.scrollIntoView({ block: 'nearest' });
        });
        renderDetail();
    }

    function move(delta) {
        if (!state.shown.length) return;
        var ix = -1;
        state.shown.forEach(function (m, i) {
            if (String(m.id) === String(state.selected)) ix = i;
        });
        var next = ix < 0 ? 0 : Math.min(Math.max(ix + delta, 0), state.shown.length - 1);
        select(state.shown[next].id);
    }

    function clearFilters() {
        state.filter = { text: '', type: '', class: '', task: '', branch: '', from: '', to: '' };
        syncFilterBar();
        persist();
        if (state.source === 'search') post({ type: 'reload' });
        else render();
    }

    function deepSearch() {
        var q = el.q.value.trim();
        if (!q) { post({ type: 'reload' }); return; }
        post({ type: 'search', query: q });
    }

    el.q.addEventListener('input', function () { readFilterBar(); render(); });
    el.q.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); deepSearch(); }
        else if (e.key === 'Escape') { el.q.value = ''; readFilterBar(); render(); }
        else if (e.key === 'ArrowDown') { e.preventDefault(); move(1); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); move(-1); }
    });
    [el.type, el.cls, el.task, el.branch, el.from, el.to].forEach(function (n) {
        n.addEventListener('change', function () { readFilterBar(); render(); });
    });
    el.clear.addEventListener('click', clearFilters);
    el.reload.addEventListener('click', function () { post({ type: 'reload' }); });
    el.retry.addEventListener('click', function () {
        show(el.error, false);
        post({ type: 'reload' });
    });
    el.dismiss.addEventListener('click', function () { show(el.notice, false); });
    el.list.addEventListener('keydown', function (e) {
        if (e.key === 'ArrowDown') { e.preventDefault(); move(1); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); move(-1); }
    });
    document.addEventListener('keydown', function (e) {
        var active = document.activeElement || {};
        var inField = /^(INPUT|SELECT|TEXTAREA)$/.test(String(active.tagName || ''));
        if (e.key === '/' && !inField) { e.preventDefault(); el.q.focus(); el.q.select(); }
    });

    /* ---------------- messages from the extension ---------------- */

    window.addEventListener('message', function (ev) {
        var msg = ev.data || {};
        if (msg.type === 'data') {
            state.memories = Array.isArray(msg.memories) ? msg.memories : [];
            state.source = msg.source || 'all';
            state.query = msg.query || '';
            state.limit = msg.limit || 0;
            state.at = msg.at || Date.now();
            state.ready = true;
            show(el.error, false);
            syncFilterBar();
            readFilterBar();
            if (state.selected !== null &&
                !state.memories.some(function (m) { return String(m.id) === String(state.selected); })) {
                state.selected = null;
            }
            render();
            return;
        }
        if (msg.type === 'loading') { show(el.progress, !!msg.on); return; }
        if (msg.type === 'busy') {
            if (msg.on) state.busy[msg.id] = msg.label || 'Working…';
            else delete state.busy[msg.id];
            renderDetail();
            return;
        }
        if (msg.type === 'notice') {
            el.notice.className = 'banner ' + (msg.kind || 'info');
            el.notice.querySelector('.text').textContent = msg.text || '';
            show(el.notice, true);
            return;
        }
        if (msg.type === 'error') {
            state.ready = true;
            show(el.progress, false);
            el.error.querySelector('.text').textContent = msg.text || 'Something went wrong.';
            show(el.error, true);
            render();
            return;
        }
    });

    syncFilterBar();
    renderEmpty();
    post({ type: 'ready' });
}());
</script>
</body>
</html>
