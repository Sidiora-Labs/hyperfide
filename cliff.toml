# git-cliff configuration for Codify — https://git-cliff.org/docs/configuration
#
# `cg changelog` renders the same changelog from git without git-cliff; this
# file is the reference it is checked against:
#
#   git cliff -o /tmp/cliff.md && ./cg changelog -o /tmp/cg.md && diff /tmp/cliff.md /tmp/cg.md
#
# Conventions it encodes: a release per tag, `[Unreleased]` for what follows
# the last tag, groups from the subject prefix (`feat:`, `fix:`, `guard:`,
# ...), and a trailing `[spec:<feature>/<task>]` turned into a task reference.

[changelog]
header = """
# Changelog

All notable changes to this project are recorded here, generated from git history.
A release is a tag; a group is the commit-subject prefix; a task reference is
the `[spec:<feature>/<task>]` a snapshot or fleet worker tagged the commit with.

"""
body = """
{%- set repo = "https://github.com/Sidiora-Labs/codify" -%}
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for entry in commits | commit_groups(groups=commit_parsers_groups) %}
### {{ entry.group | striptags | trim | upper_first }}
{% for commit in entry.commits | unique(attribute="message") -%}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{% if commit.breaking %}[**breaking**] {% endif %}\
{{ commit.message | split(pat="\n") | first | trim | upper_first }} \
([{{ commit.id | truncate(length=7, end="") }}]({{ repo }}/commit/{{ commit.id }})\
{% if commit.footers %}{% for footer in commit.footers %}{% if footer.token == "Task" %}, task {{ footer.value }}{% endif %}{% endfor %}{% endif %})
{% endfor %}
{% endfor %}
"""
footer = """
{%- set repo = "https://github.com/Sidiora-Labs/codify" -%}
{% for release in releases -%}
{% if release.version -%}
{% if release.previous and release.previous.version -%}
[{{ release.version }}]: {{ repo }}/compare/{{ release.previous.version }}...{{ release.version }}
{% else -%}
[{{ release.version }}]: {{ repo }}/releases/tag/{{ release.version }}
{% endif -%}
{% elif release.previous and release.previous.version -%}
[Unreleased]: {{ repo }}/compare/{{ release.previous.version }}...HEAD
{% endif -%}
{% endfor %}
"""
trim = true
render_always = false
postprocessors = []

[git]
conventional_commits = true
filter_unconventional = false
require_conventional = false
split_commits = false
commit_preprocessors = [
    # attribution trailers are not release notes
    { pattern = '(?m)^(Co-Authored-By|Signed-off-by|Claude-Session):.*$', replace = "" },
    # the task a commit was made under, tagged on the subject line, becomes a
    # footer the template can read; the body, if any, stays where it was
    { pattern = '(?s)^(.*?)[ \t]*\[spec:([^\]]+)\][ \t]*(.*?)\s*$', replace = "${1}${3}\n\nTask: ${2}" },
]
protect_breaking_commits = false
commit_parsers = [
    { message = "^Merge (branch|pull request|remote-tracking)", skip = true },
    { message = "^(feat|feature)(\\(|!|:)", group = "Features" },
    { message = "^(fix|bugfix|hotfix)(\\(|!|:)", group = "Bug fixes" },
    { message = "^perf(\\(|!|:)", group = "Performance" },
    { message = "^refactor(\\(|!|:)", group = "Refactoring" },
    { message = "^docs?(\\(|!|:)", group = "Documentation" },
    { message = "^tests?(\\(|!|:)", group = "Tests" },
    { message = "^style(\\(|!|:)", group = "Style" },
    { message = "^(build|ci|chore|deps)(\\(|!|:)", group = "Build and tooling" },
    { message = "^revert(\\(|!|:)", group = "Reverts" },
    { message = "^(release(\\(|!|:)|Codify [0-9])", group = "Releases" },
    { message = "^(extension|vscode)(\\(|!|:)", group = "Extension" },
    { message = "^spec(\\(|!|:)", group = "Spec workflow" },
    # Codify's own areas, in the order the changelog lists them
    { message = "^guard(\\(|!|:)", group = "Guard" },
    { message = "^anchors?(\\(|!|:)", group = "Anchors" },
    { message = "^graph(\\(|!|:)", group = "Graph" },
    { message = "^sync(\\(|!|:)", group = "Sync" },
    { message = "^fleet(\\(|!|:)", group = "Fleet" },
    { message = "^orchestrate(\\(|!|:)", group = "Orchestrate" },
    { message = "^jev(\\(|!|:)", group = "Jev" },
    { message = "^skills?(\\(|!|:)", group = "Skills" },
    { message = "^memory(\\(|!|:)", group = "Memory" },
    { message = "^(mcp|lsp)(\\(|!|:)", group = "Protocols" },
    # a subject with no `area:` prefix
    { message = '\A[^:\n]*(\n|\z)', group = "Other" },
    # any other `area:` prefix is its own group, listed after the ones above
    { message = "^([a-z][a-z0-9_-]*)(\\(|!|:)", group = "${1}" },
    { message = ".*", group = "Other" },
]
filter_commits = false
fail_on_unmatched_commit = false
link_parsers = []
use_branch_tags = false
topo_order = false
topo_order_commits = true
sort_commits = "newest"
recurse_submodules = false
