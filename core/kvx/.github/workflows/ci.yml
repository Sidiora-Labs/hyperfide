name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Vet
        working-directory: impl/go
        run: go vet ./...
      - name: Conformance suite
        working-directory: impl/go
        run: go test ./... -count=1
